<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnClaw</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <style>
        /*  Design tokens  */
        :root {
            --bg:          #0d0f14;
            --bg-elevated: #13161f;
            --bg-input:    #1a1d27;
            --surface:     #1c2030;
            --border:      rgba(255,255,255,.07);
            --border-mid:  rgba(255,255,255,.1);
            --accent:      #5b5fc7;
            --accent-hi:   #818cf8;
            --accent-glow: rgba(91,95,199,.22);
            --user-bg:     #3730a3;
            --user-hi:     #4338ca;
            --text-1:      #f0f1f5;
            --text-2:      #9ca3af;
            --text-3:      #5c6479;
            --red:         #f87171;
            --red-dim:     rgba(248,113,113,.12);
            --green:       #34d399;
            --green-dim:   rgba(52,211,153,.15);
            --r-sm:        8px;
            --r-md:        12px;
            --r-lg:        16px;
            --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
            --shadow-md:   0 4px 20px rgba(0,0,0,.5);
            --shadow-lg:   0 12px 48px rgba(0,0,0,.7);
            --font:        -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
            --font-mono:   "Cascadia Code","Fira Code","JetBrains Mono","SF Mono", monospace;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-1);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /*  Auth overlay  */
        #auth-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #auth-overlay.hidden { display: none }

        .auth-loading {
            color: var(--text-3);
            font-size: 14px;
            letter-spacing: .01em;
        }

        #auth-box {
            width: 360px;
            max-width: 92vw;
            background: var(--bg-elevated);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .auth-logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .auth-logo-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        #auth-box h2 {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -.2px;
        }
        #auth-box .subtitle {
            color: var(--text-2);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .auth-field input {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: var(--bg-input);
            color: var(--text-1);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .auth-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-field input::placeholder { color: var(--text-3) }

        #auth-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: opacity .15s, transform .1s, box-shadow .15s;
            box-shadow: 0 4px 16px var(--accent-glow);
            letter-spacing: .01em;
        }
        #auth-submit:hover { opacity: .88; transform: translateY(-1px) }
        #auth-submit:active { transform: translateY(0); opacity: 1 }
        #auth-submit:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #auth-error {
            color: var(--red);
            font-size: 12.5px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            background: var(--red-dim);
            border-radius: 8px;
        }
        #auth-toggle {
            color: var(--accent-hi);
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            cursor: pointer;
            transition: opacity .15s;
        }
        #auth-toggle:hover { opacity: .75 }

        /*  Header  */
        #header {
            height: 52px;
            flex-shrink: 0;
            padding: 0 20px;
            background: rgba(13,15,20,.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px) saturate(1.4);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.25px;
        }
        #header-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        #conn-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            font-size: 11.5px;
            color: var(--text-3);
            transition: all .3s;
        }
        #conn-pill.online {
            color: var(--green);
            border-color: rgba(52,211,153,.25);
            background: var(--green-dim);
        }
        .conn-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        #conn-pill.online .conn-dot {
            box-shadow: 0 0 6px var(--green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1 }
            50% { opacity: .5 }
        }

        .header-spacer { flex: 1 }

        #logout-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: none;
            color: var(--text-3);
            font-size: 12px;
            font-family: var(--font);
            cursor: pointer;
            transition: all .15s;
        }
        #logout-btn:hover {
            color: var(--red);
            border-color: rgba(248,113,113,.3);
            background: var(--red-dim);
        }
        #logout-btn svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0 }

        /*  Messages scroll area  */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 5px }
        #messages::-webkit-scrollbar-track { background: transparent }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px }
        #messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.14) }

        /* Column constraint */
        .msg, #conn-banner, #thinking {
            max-width: 780px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /*  Message animations  */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) }
            to   { opacity: 1; transform: none }
        }

        /*  Base message  */
        .msg {
            animation: msgIn .2s cubic-bezier(.16,1,.3,1) both;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* Group spacing — extra gap before a new sender */
        .msg.first-in-run { margin-top: 20px }
        .msg:first-child  { margin-top: 0 }

        /* ───── User message ───── */
        .msg.user {
            display: flex;
            justify-content: flex-end;
            padding: 2px 0;
        }
        .msg.user .bubble {
            max-width: 72%;
            background: var(--user-hi);
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--r-md) var(--r-md) 4px var(--r-md);
            font-size: 14.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow: 0 1px 8px rgba(55,48,163,.25);
        }
        /* Consecutive user messages: flatten top-right corner */
        .msg.user:not(.first-in-run) .bubble {
            border-radius: var(--r-md) 6px 4px var(--r-md);
        }

        /* ───── AI / assistant message ───── */
        .msg.response,
        .msg.error,
        .msg.question,
        .msg.input_request,
        .msg.debug {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 2px 0;
        }

        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: var(--r-sm);
            background: linear-gradient(135deg, var(--user-bg) 0%, var(--accent) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 4px;
            box-shadow: 0 2px 8px var(--accent-glow);
            user-select: none;
        }
        .msg:not(.first-in-run) .msg-avatar { visibility: hidden }

        .msg-body {
            flex: 1;
            min-width: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px var(--r-md) var(--r-md) var(--r-md);
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--text-1);
        }
        /* Consecutive AI messages: soften top-left corner */
        .msg:not(.first-in-run) .msg-body {
            border-radius: 6px var(--r-md) var(--r-md) var(--r-md);
        }

        /* Error variant */
        .msg.error .msg-avatar {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
        }
        .msg.error .msg-body {
            background: var(--red-dim);
            border: 1px solid rgba(248,113,113,.15);
            border-left: 3px solid var(--red);
            color: #fca5a5;
        }

        /* Question / input_request variant */
        .msg.question .msg-avatar,
        .msg.input_request .msg-avatar {
            background: linear-gradient(135deg, #1e1b4b, var(--accent));
        }
        .msg.question .msg-body,
        .msg.input_request .msg-body {
            background: rgba(91,95,199,.06);
            border: 1px solid rgba(91,95,199,.2);
            border-left: 3px solid var(--accent-hi);
        }

        /* Debug variant */
        .msg.debug .msg-avatar {
            background: linear-gradient(135deg, #422006, #92400e);
        }
        .msg.debug .msg-body {
            background: rgba(251,191,36,.04);
            border: 1px solid rgba(251,191,36,.15);
            border-left: 3px solid #fbbf24;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-2);
            max-height: 500px;
            overflow-y: auto;
        }
        .msg.debug .msg-body::-webkit-scrollbar { width: 4px }
        .msg.debug .msg-body::-webkit-scrollbar-thumb { background: rgba(251,191,36,.2); border-radius: 4px }

        /* ───── System messages ───── */
        /* Short: centred pill.  Long (contains newline or >80 chars): card. */
        .msg.system {
            align-self: center;
            text-align: left;
            font-size: 13px;
            color: var(--text-2);
            padding: 10px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            margin: 10px auto;
            max-width: 620px;
            line-height: 1.65;
        }
        /* Truly short system messages get the pill look */
        .msg.system.short {
            text-align: center;
            padding: 6px 16px;
            border-radius: 100px;
            max-width: 480px;
            font-size: 12.5px;
            color: var(--text-3);
        }

        /*  Connection banner  */
        #conn-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            margin: 0 auto 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--text-3);
            font-size: 13px;
        }
        #conn-banner.visible { display: flex }
        #conn-banner .spinner {
            width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg) } }

        /*  Activity log — pinned above the input bar, always visible  */
        .activity-wrap {
            flex-shrink: 0;
            background: rgba(13,15,20,.9);
            backdrop-filter: blur(12px);
            padding: 0 20px;
        }
        #activity {
            max-width: 780px;
            margin: 0 auto;
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }
        #activity-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            transition: background .12s;
        }
        #activity-header:hover { background: rgba(255,255,255,.03) }

        .activity-spinner {
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        .activity-spinner.done {
            border: 2px solid var(--green);
            animation: none;
        }

        #activity-label {
            flex: 1;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 500;
        }
        #activity-tokens {
            font-size: 11px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
            white-space: nowrap;
        }
        #activity-elapsed {
            font-size: 11px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
            min-width: 36px;
            text-align: right;
        }
        .activity-toggle {
            font-size: 10px;
            color: var(--text-3);
            transition: transform .2s;
            line-height: 1;
        }
        .activity-toggle.open { transform: rotate(180deg) }

        #activity-steps {
            display: none;
            border-top: 1px solid var(--border);
            padding: 6px 0 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        #activity-steps.visible { display: block }
        #activity-steps::-webkit-scrollbar { width: 3px }
        #activity-steps::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 3px }

        .activity-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 14px;
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.5;
        }
        .step-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--border-mid);
            flex-shrink: 0;
            margin-top: 5px;
        }
        .activity-step.latest { color: var(--text-2) }
        .activity-step.latest .step-dot { background: var(--accent-hi) }

        /*  Thinking indicator  */
        #thinking {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        #thinking.active { display: flex }

        .thinking-avatar {
            width: 30px; height: 30px;
            border-radius: var(--r-sm);
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            opacity: .55;
        }
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px var(--r-md) var(--r-md) var(--r-md);
        }
        .thinking-dots span {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-hi);
            opacity: .4;
            animation: blink 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: 0s }
        .thinking-dots span:nth-child(2) { animation-delay: .2s }
        .thinking-dots span:nth-child(3) { animation-delay: .4s }
        @keyframes blink {
            0%, 80%, 100% { opacity: .2; transform: scale(.8) }
            40%            { opacity: 1;  transform: scale(1.1) }
        }

        /*  Markdown inside message bodies  */
        .md p { margin: 0 0 8px }
        .md p:last-child { margin-bottom: 0 }
        .md ul, .md ol { margin: 4px 0 8px 20px }
        .md li { margin: 2px 0; line-height: 1.6 }
        .md li > p { margin-bottom: 2px }
        .md strong { color: #fff; font-weight: 600 }
        .md em { color: #c9d1e2 }
        .md a { color: var(--accent-hi); text-decoration: none }
        .md a:hover { text-decoration: underline; color: #a5b4fc }
        .md blockquote {
            border-left: 3px solid rgba(255,255,255,.12);
            padding: 2px 14px;
            margin: 8px 0;
            color: var(--text-2);
        }
        .md h1,.md h2,.md h3 { margin: 16px 0 6px; font-weight: 600; color: #fff }
        .md h1 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: 6px }
        .md h2 { font-size: 1.12em }
        .md h3 { font-size: 1.02em }
        .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0 }
        .md table { border-collapse: collapse; margin: 8px 0; width: 100%; display: block; overflow-x: auto }
        .md th, .md td { border: 1px solid rgba(255,255,255,.08); padding: 6px 12px; text-align: left; font-size: 13px }
        .md th { background: rgba(255,255,255,.04); font-weight: 600; color: #fff }
        .md tr:nth-child(even) td { background: rgba(255,255,255,.02) }
        .md img { max-width: 100%; height: auto; border-radius: var(--r-sm); margin: 8px 0 }
        .md code {
            background: rgba(255,255,255,.07);
            padding: 1.5px 5px;
            border-radius: 4px;
            font-size: 12.5px;
            font-family: var(--font-mono);
            color: #c4b5fd;
        }
        .md pre {
            background: #0a0c12;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 14px 16px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .md pre code {
            background: none;
            padding: 0;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-1);
            font-family: var(--font-mono);
        }
        .code-block-wrap { position: relative }
        .copy-btn {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            color: var(--text-3);
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-family: var(--font);
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s, color .15s, background .15s;
        }
        .code-block-wrap:hover .copy-btn { opacity: 1 }
        .copy-btn:hover { background: rgba(255,255,255,.12); color: var(--text-1) }
        .copy-btn.copied { color: var(--green); opacity: 1 }

        /*  Input area  */
        #input-area {
            flex-shrink: 0;
            padding: 10px 20px 18px;
            background: rgba(13,15,20,.92);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .input-wrap {
            max-width: 780px;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            display: flex;
            align-items: flex-end;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-wrap:focus-within {
            border-color: rgba(91,95,199,.45);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #input {
            flex: 1;
            padding: 12px 16px;
            background: none;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-1);
            font-size: 14.5px;
            font-family: var(--font);
            line-height: 1.55;
            max-height: 160px;
            min-height: 48px;
        }
        #input::placeholder { color: var(--text-3) }

        #send {
            width: 36px; height: 36px;
            margin: 6px 8px 6px 0;
            flex-shrink: 0;
            background: var(--accent);
            border: none;
            border-radius: var(--r-sm);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .15s, transform .1s, background .15s;
        }
        #send:hover { background: var(--accent-hi); transform: scale(1.04) }
        #send:active { transform: scale(.96) }
        #send:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
        }
        #send svg { width: 16px; height: 16px; fill: currentColor }

        #stop {
            width: 36px; height: 36px;
            margin: 6px 8px 6px 0;
            flex-shrink: 0;
            background: rgba(220, 60, 60, .85);
            border: none;
            border-radius: var(--r-sm);
            color: #fff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity .15s, transform .1s;
            box-shadow: 0 2px 8px rgba(220,60,60,.3);
        }
        #stop.visible { display: flex; }
        #stop:hover { opacity: .85; transform: scale(1.04) }
        #stop:active { transform: scale(.96) }
        #stop svg { width: 12px; height: 12px; fill: currentColor }

        .input-hint {
            max-width: 780px;
            margin: 6px auto 0;
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: .01em;
        }

        /*  Responsive  */
        @media (max-width: 600px) {
            #messages { padding: 16px 10px 12px }
            #input-area { padding: 8px 10px 14px }
            .msg.user .bubble { max-width: 88% }
            .msg-body { padding: 10px 12px }
            #header { padding: 0 12px }
            #sidebar { display: none }
            #sidebar.mobile-open { display: flex; position: fixed; inset: 0; z-index: 100; width: 100% }
            #sidebar-toggle { display: flex }
        }

        /*  Layout: sidebar + main  */
        #app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /*  Sidebar  */
        #sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
        }

        #sidebar-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        #new-chat-btn {
            flex: 1;
            padding: 9px 14px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity .15s, transform .1s;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        #new-chat-btn:hover { opacity: .88; transform: translateY(-1px) }
        #new-chat-btn:active { transform: translateY(0) }
        #new-chat-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0 }

        #sidebar-close {
            display: none;
            width: 32px; height: 32px;
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-3);
            font-size: 16px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #sidebar-close { display: flex }
        }

        /*  Search  */
        #search-wrap {
            padding: 10px 14px 6px;
        }
        #search-input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-1);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        #search-input::placeholder { color: var(--text-3) }
        .search-icon-wrap {
            position: relative;
        }
        .search-icon-wrap svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 13px;
            fill: var(--text-3);
            pointer-events: none;
        }

        /*  Session list  */
        #session-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        #session-list::-webkit-scrollbar { width: 4px }
        #session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.06); border-radius: 3px }

        .session-item {
            padding: 10px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background .12s;
            margin-bottom: 2px;
            position: relative;
        }
        .session-item:hover { background: rgba(255,255,255,.04) }
        .session-item.active {
            background: rgba(91,95,199,.12);
            border: 1px solid rgba(91,95,199,.2);
        }
        .session-item:not(.active) { border: 1px solid transparent }

        .session-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 24px;
        }
        .session-preview {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-meta {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            gap: 2px;
        }
        .session-item:hover .session-actions { display: flex }
        .session-action-btn {
            width: 22px; height: 22px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-3);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .12s, border-color .12s;
        }
        .session-action-btn:hover { color: var(--text-1); border-color: var(--border-mid) }
        .session-action-btn.delete:hover { color: var(--red); border-color: rgba(248,113,113,.3) }

        /*  Search results overlay  */
        #search-results {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        #search-results.visible {
            display: block;
        }
        #search-results.visible ~ #session-list { display: none }

        .search-result-item {
            padding: 10px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background .12s;
            margin-bottom: 4px;
            border: 1px solid var(--border);
        }
        .search-result-item:hover { background: rgba(255,255,255,.04) }
        .search-result-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-1);
        }
        .search-result-snippet {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 4px;
            line-height: 1.5;
        }
        .search-result-snippet mark {
            background: rgba(91,95,199,.3);
            color: var(--text-1);
            border-radius: 2px;
            padding: 0 2px;
        }
        .search-empty {
            text-align: center;
            padding: 24px 16px;
            color: var(--text-3);
            font-size: 13px;
        }

        /*  Loading spinner for session list  */
        .session-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px 16px;
            color: var(--text-3);
            font-size: 13px;
        }
        .session-loading .mini-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.08);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }

        /*  Session item delete animation  */
        .session-item.deleting {
            opacity: .4;
            pointer-events: none;
            transform: translateX(8px);
            transition: opacity .25s, transform .25s;
        }
        .session-item.fade-out {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
            overflow: hidden;
            transition: opacity .2s, max-height .3s .05s, padding .3s .05s, margin .3s .05s;
        }

        /*  Session item renaming state  */
        .session-item.renaming .session-title {
            opacity: .5;
        }

        /*  Messages loading overlay  */
        .messages-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 48px 16px;
            color: var(--text-3);
            font-size: 13px;
        }
        .messages-loading .mini-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.08);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }

        /*  Main chat column  */
        #chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /*  Sidebar toggle button (mobile)  */
        #sidebar-toggle {
            display: none;
            width: 32px; height: 32px;
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-2);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #sidebar-toggle svg { width: 16px; height: 16px; fill: currentColor }
        #sidebar-toggle:hover { color: var(--text-1); border-color: var(--border-mid) }

        /*  Pinned scheduled tasks item  */
        .session-item.pinned {
            border: 1px solid rgba(52,211,153,.15) !important;
            background: rgba(52,211,153,.06);
            margin-bottom: 8px;
            position: relative;
        }
        .session-item.pinned::after {
            content: '';
            display: block;
            position: absolute;
            bottom: -5px;
            left: 12px;
            right: 12px;
            height: 1px;
            background: var(--border);
        }
        .session-item.pinned:hover { background: rgba(52,211,153,.1) }
        .session-item.pinned.active {
            background: rgba(52,211,153,.14);
            border-color: rgba(52,211,153,.3) !important;
        }
        .session-item.pinned .session-title {
            padding-right: 0;
        }
        .pinned-icon {
            margin-right: 6px;
            font-size: 14px;
        }
        .pinned-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            color: var(--green);
            background: var(--green-dim);
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            letter-spacing: .03em;
        }

        /*  Task history view (replaces messages area)  */
        .task-history {
            padding: 20px 24px;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }
        .task-history-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .task-history-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-1);
            margin: 0;
        }
        .task-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .task-stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 12px 16px;
            min-width: 120px;
            flex: 1;
        }
        .task-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-1);
            line-height: 1.2;
        }
        .task-stat-value.green { color: var(--green) }
        .task-stat-value.red { color: var(--red) }
        .task-stat-label {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        /*  Active tasks section  */
        .task-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin: 24px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .task-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /*  Task run timeline entry  */
        .task-run {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            margin-bottom: 8px;
            overflow: hidden;
            transition: border-color .15s;
        }
        .task-run:hover { border-color: var(--border-mid) }
        .task-run-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
        }
        .task-run-status {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .task-run-status.completed { background: var(--green) }
        .task-run-status.failed { background: var(--red) }
        .task-run-desc {
            flex: 1;
            font-size: 13px;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-run-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-3);
            flex-shrink: 0;
        }
        .task-run-duration {
            color: var(--text-2);
            font-family: var(--font-mono);
            font-size: 11px;
        }
        .task-run-toggle {
            font-size: 10px;
            color: var(--text-3);
            transition: transform .2s;
        }
        .task-run.expanded .task-run-toggle {
            transform: rotate(180deg);
        }

        /*  Task run expanded details  */
        .task-run-details {
            display: none;
            border-top: 1px solid var(--border);
            padding: 14px;
            background: var(--bg-elevated);
        }
        .task-run.expanded .task-run-details { display: block }
        .task-detail-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .task-detail-label {
            color: var(--text-3);
            min-width: 80px;
            flex-shrink: 0;
            font-weight: 500;
        }
        .task-detail-value {
            color: var(--text-2);
            word-break: break-word;
            flex: 1;
        }
        .task-detail-value.error { color: var(--red) }
        .task-detail-value.success { color: var(--green) }
        .task-result-content {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 10px 12px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-2);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 4px;
            line-height: 1.5;
        }
        .task-result-content::-webkit-scrollbar { width: 4px }
        .task-result-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px }

        /*  Active task card  */
        .active-task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 12px 14px;
            margin-bottom: 6px;
            transition: border-color .15s;
            overflow: hidden;
        }
        .active-task-card:hover { border-color: var(--border-mid) }
        .active-task-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .active-task-type {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .active-task-type.recurring {
            color: var(--accent-hi);
            background: var(--accent-glow);
        }
        .active-task-type.deferred {
            color: #fbbf24;
            background: rgba(251,191,36,.12);
        }
        .active-task-desc {
            font-size: 13px;
            color: var(--text-1);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .active-task-meta {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 6px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .task-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /*  Task card actions  */
        .task-card-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .task-action-btn {
            width: 28px; height: 28px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-3);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .12s, border-color .12s, background .12s;
            padding: 0;
        }
        .task-action-btn:hover { color: var(--text-1); border-color: var(--border-mid); background: var(--surface) }
        .task-action-btn.danger:hover { color: var(--red); border-color: rgba(248,113,113,.3) }
        .task-action-btn.success:hover { color: var(--green); border-color: rgba(52,211,153,.3) }
        .task-action-btn:disabled { opacity: .4; cursor: not-allowed }

        /*  Task card status badge  */
        .task-status-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: .03em;
            flex-shrink: 0;
        }
        .task-status-badge.active   { color: var(--green); background: var(--green-dim) }
        .task-status-badge.paused   { color: #fbbf24; background: rgba(251,191,36,.12) }
        .task-status-badge.running  { color: var(--accent-hi); background: var(--accent-glow) }
        .task-status-badge.completed { color: var(--text-3); background: rgba(255,255,255,.05) }
        .task-status-badge.cancelled { color: var(--text-3); background: rgba(255,255,255,.05) }
        .task-status-badge.failed   { color: var(--red); background: var(--red-dim) }

        /*  Expandable task detail  */
        .task-card-detail {
            display: none;
            border-top: 1px solid var(--border);
            margin-top: 10px;
            padding-top: 10px;
        }
        .active-task-card.expanded .task-card-detail { display: block }
        .task-card-toggle {
            font-size: 10px;
            color: var(--text-3);
            transition: transform .2s;
            cursor: pointer;
            padding: 4px;
        }
        .active-task-card.expanded .task-card-toggle { transform: rotate(180deg) }

        /*  Task edit modal  */
        .task-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn .15s;
        }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        .task-modal {
            width: 460px;
            max-width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-lg);
        }
        .task-modal h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 18px;
            color: var(--text-1);
        }
        .task-modal-field {
            margin-bottom: 14px;
        }
        .task-modal-field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 5px;
        }
        .task-modal-field input,
        .task-modal-field textarea {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-1);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .task-modal-field textarea {
            min-height: 80px;
            resize: vertical;
        }
        .task-modal-field input:focus,
        .task-modal-field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .task-modal-field .field-hint {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
        }
        .task-modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .task-modal-btn {
            padding: 8px 18px;
            border-radius: var(--r-sm);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            border: 1px solid var(--border);
            transition: opacity .15s, background .15s;
        }
        .task-modal-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .task-modal-btn.primary:hover { background: var(--accent-hi) }
        .task-modal-btn.secondary {
            background: var(--surface);
            color: var(--text-2);
        }
        .task-modal-btn.secondary:hover { color: var(--text-1) }
        .task-modal-error {
            color: var(--red);
            font-size: 12px;
            margin-top: 8px;
        }

        /*  Completed/inactive task cards  */
        .active-task-card.inactive {
            opacity: .6;
        }
        .active-task-card.inactive:hover { opacity: .8 }

        .task-empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-3);
        }
        .task-empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .task-empty-text {
            font-size: 14px;
        }
        .task-empty-sub {
            font-size: 12px;
            margin-top: 6px;
            color: var(--text-3);
            opacity: .7;
        }

        .task-history-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 48px 16px;
            color: var(--text-3);
            font-size: 13px;
        }
        .task-history-loading .mini-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.08);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }

        /*  Skills view  */
