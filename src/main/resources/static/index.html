<!--  Messages  -->
<div id="messages">
    <div id="conn-banner"><div class="spinner"></div><span id="conn-text"></span></div>

    <div id="thinking">
        <div class="thinking-avatar">&#x1F980;</div>
        <div class="thinking-dots"><span></span><span></span><span></span></div>
    </div>
</div>

<!--  Activity status — pinned above input, always visible during task execution  -->
<div class="activity-wrap" id="activity-wrap" style="display:none">
    <div id="activity">
        <div id="activity-header">
            <div class="activity-spinner" id="activity-spinner"></div>
            <span id="activity-label">Working...</span>
            <span id="activity-tokens"></span>
            <span id="activity-elapsed"></span>
            <span class="activity-toggle" id="activity-toggle">&#x25be;</span>
        </div>
        <div id="activity-steps"></div>
    </div>
</div>

<!--  Input bar  -->
<div id="input-area">
    <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Message OwnClaw..." autocomplete="off"></textarea>
        <button id="send" title="Send (Enter)">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
        <button id="stop" title="Stop task">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter for new line</div>
</div>

    </div><!-- end #chat-main -->
</div><!-- end #app-layout -->

<script>
(function() {
    var authOverlay  = document.getElementById('auth-overlay');
    var authLoading  = document.getElementById('auth-loading');
    var authBox      = document.getElementById('auth-box');
    var authTitle    = document.getElementById('auth-title');
    var authSubtitle = document.getElementById('auth-subtitle');
    var authUsername = document.getElementById('auth-username');
    var authPassword = document.getElementById('auth-password');
    var authSubmit   = document.getElementById('auth-submit');
    var authError    = document.getElementById('auth-error');
    var authToggle   = document.getElementById('auth-toggle');
    var logoutBtn    = document.getElementById('logout-btn');
    var settingsBtn  = document.getElementById('settings-btn');
    var skillsBtn    = document.getElementById('skills-btn');
    var tasksBtn     = document.getElementById('tasks-btn');

    settingsBtn.addEventListener('click', function() {
        if (currentView === 'settings') return;
        switchToSettings();
    });

    skillsBtn.addEventListener('click', function() {
        if (currentView === 'skills') return;
        switchToSkills();
    });

    tasksBtn.addEventListener('click', function() {
        if (currentView === 'tasks') return;
        switchToTaskHistory();
    });

    var messagesEl      = document.getElementById('messages');
    var thinkingEl      = document.getElementById('thinking');
    var inputEl         = document.getElementById('input');
    var sendBtn         = document.getElementById('send');
    var stopBtn         = document.getElementById('stop');
    var connPill        = document.getElementById('conn-pill');
    var connLabel       = document.getElementById('conn-label');
    var connBanner      = document.getElementById('conn-banner');
    var connText        = document.getElementById('conn-text');

    var activityWrap    = document.getElementById('activity-wrap');
    var activitySpinner = document.getElementById('activity-spinner');
    var activityLabel   = document.getElementById('activity-label');
    var activityTokens  = document.getElementById('activity-tokens');
    var activityElapsed = document.getElementById('activity-elapsed');
    var activityStepsEl = document.getElementById('activity-steps');
    var activityToggle  = document.getElementById('activity-toggle');
    var activityHeader  = document.getElementById('activity-header');

    // Sidebar elements
    var sidebar         = document.getElementById('sidebar');
    var sidebarToggle   = document.getElementById('sidebar-toggle');
    var sidebarClose    = document.getElementById('sidebar-close');
    var newChatBtn      = document.getElementById('new-chat-btn');
    var searchInput     = document.getElementById('search-input');
    var searchResults   = document.getElementById('search-results');
    var sessionListEl   = document.getElementById('session-list');

    var reconnectAttempt = 0;
    var authToken  = localStorage.getItem('ownclaw_token');
    var isRegisterMode = true;
    var activityStepList = [];
    var activityOpen = false;
    var ws;
    var busy = false;
    var lastMsgSender = null;
    var heartbeatTimer = null;
    var thinkingSafetyTimer = null;
    var activeSessionId = null;
    var currentView = 'chat'; // 'chat' or 'tasks'
    var thinkingStartedAt = null;
    var elapsedTimer = null;
    var searchDebounce = null;
    var needsInitialLoad = false;

    marked.setOptions({ breaks: true, gfm: true });

    //  Sidebar interactions
    sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('mobile-open');
    });
    sidebarClose.addEventListener('click', function() {
        sidebar.classList.remove('mobile-open');
    });

    newChatBtn.addEventListener('click', function() {
        if (ws && ws.readyState === 1) {
            currentView = 'chat';
            document.getElementById('input-area').style.display = '';
            ws.send(JSON.stringify({ type: 'new_session', message: '' }));
            clearMessages();
            sidebar.classList.remove('mobile-open');
        }
    });

    //  Search
    searchInput.addEventListener('input', function() {
        clearTimeout(searchDebounce);
        var q = searchInput.value.trim();
        if (!q) {
            searchResults.classList.remove('visible');
            searchResults.innerHTML = '';
            return;
        }
        searchDebounce = setTimeout(function() { doSearch(q); }, 300);
    });

    function doSearch(query) {
        if (!authToken) return;
        fetch('/api/chats/search?q=' + encodeURIComponent(query), {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            searchResults.innerHTML = '';
            var results = data.results || [];
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-empty">No results found</div>';
            } else {
                // Group by session
                var seen = {};
                results.forEach(function(r) {
                    if (seen[r.session_id]) return;
                    seen[r.session_id] = true;
                    var item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.innerHTML =
                        '<div class="search-result-title">' + escapeHtml(r.title || 'Untitled') + '</div>' +
                        '<div class="search-result-snippet">' + (r.snippet || '') + '</div>';
                    item.addEventListener('click', function() {
                        switchToSession(r.session_id);
                        searchInput.value = '';
                        searchResults.classList.remove('visible');
                        searchResults.innerHTML = '';
                        sidebar.classList.remove('mobile-open');
                    });
                    searchResults.appendChild(item);
                });
            }
            searchResults.classList.add('visible');
        })
        .catch(function(e) {
            console.error('Search failed:', e);
        });
    }

    //  Session management
    function switchToSession(sessionId) {
        if (!ws || ws.readyState !== 1) return;
        currentView = 'chat';
        // Show chat UI elements, hide task history/settings/skills
        document.getElementById('input-area').style.display = '';
        document.getElementById('activity-wrap').style.display = '';
        settingsBtn.classList.remove('active');
        skillsBtn.classList.remove('active');
        tasksBtn.classList.remove('active');
        ws.send(JSON.stringify({ type: 'switch_session', message: sessionId }));
        clearMessages();
        // Update sidebar active states
        updateSidebarActive(sessionId);
        // Load session messages via REST
        loadSessionMessages(sessionId);
    }

    function loadSessionMessages(sessionId) {
        if (!authToken) return;
        // Show loading spinner in messages area
        clearMessages();
        var loader = document.createElement('div');
        loader.className = 'messages-loading';
        loader.innerHTML = '<div class="mini-spinner"></div><span>Loading messages...</span>';
        messagesEl.appendChild(loader);

        fetch('/api/chats/' + sessionId + '/messages', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            clearMessages();
            var msgs = data.messages || [];
            msgs.forEach(function(m) {
                var type = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'response');
                addMsg(type, m.content);
            });
        })
        .catch(function(e) {
            clearMessages();
            console.error('Failed to load messages:', e);
        });
    }

    function clearMessages() {
        messagesEl.querySelectorAll('.msg, .messages-loading, .task-history, .task-history-loading, .settings-view, .skills-view').forEach(function(m) { m.remove(); });
        lastMsgSender = null;
    }

    function renderSessionList(sessions, currentActiveId) {
        sessionListEl.innerHTML = '';
        activeSessionId = currentActiveId;

        if (!sessions || sessions.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'search-empty';
            empty.textContent = 'No chats yet';
            sessionListEl.appendChild(empty);
            return;
        }
        sessions.forEach(function(s) {
            var item = document.createElement('div');
            var isActive = (currentView === 'chat' && s.id === activeSessionId);
            item.className = 'session-item' + (isActive ? ' active' : '');
            item.setAttribute('data-session-id', s.id);
            var timeStr = formatTime(s.updated_at);
            var msgCount = s.message_count || 0;
            item.innerHTML =
                '<div class="session-title">' + escapeHtml(s.title || 'Untitled') + '</div>' +
                (s.preview ? '<div class="session-preview">' + escapeHtml(s.preview) + '</div>' : '') +
                '<div class="session-meta"><span>' + timeStr + '</span><span>' + msgCount + ' msgs</span></div>' +
                '<div class="session-actions">' +
                    '<button class="session-action-btn rename" title="Rename">&#x270F;</button>' +
                    '<button class="session-action-btn delete" title="Delete">&#x2715;</button>' +
                '</div>';

            item.addEventListener('click', function(e) {
                if (e.target.closest('.session-action-btn')) return;
                if (currentView === 'tasks' || s.id !== activeSessionId) {
                    switchToSession(s.id);
                } else {
                    // Already active chat — just reload messages
                    loadSessionMessages(s.id);
                }
                sidebar.classList.remove('mobile-open');
            });

            // Rename button
            item.querySelector('.rename').addEventListener('click', function(e) {
                e.stopPropagation();
                var newTitle = prompt('Rename chat:', s.title);
                if (newTitle && newTitle.trim()) {
                    renameSession(s.id, newTitle.trim());
                }
            });

            // Delete button
            item.querySelector('.delete').addEventListener('click', function(e) {
                e.stopPropagation();
                if (confirm('Delete this chat? This cannot be undone.')) {
                    deleteSession(s.id);
                }
            });

            sessionListEl.appendChild(item);
        });
    }

    function updateSidebarActive(sessionId) {
        sessionListEl.querySelectorAll('.session-item').forEach(function(el) {
            var sid = el.getAttribute('data-session-id');
            el.classList.toggle('active', currentView === 'chat' && sid === sessionId);
        });
    }

    function switchToTaskHistory() {
        currentView = 'tasks';
        clearMessages();
        // Hide chat input and activity bar when viewing tasks
        document.getElementById('input-area').style.display = 'none';
        document.getElementById('activity-wrap').style.display = 'none';
        tasksBtn.classList.add('active');
        settingsBtn.classList.remove('active');
        skillsBtn.classList.remove('active');
        // Update sidebar active states
        updateSidebarActive(null);
        loadTaskHistory();
    }

    function loadTaskHistory() {
        if (!authToken) return;
        // Show loading spinner
        var loader = document.createElement('div');
        loader.className = 'task-history-loading';
        loader.innerHTML = '<div class="mini-spinner"></div><span>Loading task history...</span>';
        messagesEl.appendChild(loader);

        // Fetch both tasks and run history in parallel
        Promise.all([
            fetch('/api/scheduled-tasks', { headers: { 'Authorization': 'Bearer ' + authToken } }).then(function(r) { return r.json(); }),
            fetch('/api/scheduled-tasks/runs?limit=50', { headers: { 'Authorization': 'Bearer ' + authToken } }).then(function(r) { return r.json(); })
        ])
        .then(function(results) {
            clearMessages();
            var tasksData = results[0];
            var runsData = results[1];
            renderTaskHistory(tasksData.tasks || [], runsData.runs || [], runsData.stats || {});
        })
        .catch(function(e) {
            clearMessages();
            console.error('Failed to load task history:', e);
            var errDiv = document.createElement('div');
            errDiv.className = 'task-empty';
            errDiv.innerHTML = '<div class="task-empty-icon">⚠️</div><div class="task-empty-text">Failed to load task history</div>';
            messagesEl.insertBefore(errDiv, thinkingEl);
        });
    }

    function renderTaskHistory(tasks, runs, stats) {
        var container = document.createElement('div');
        container.className = 'task-history';

        // ── Header ──
        container.innerHTML = '<div class="task-history-header"><h2>\uD83D\uDCCB Scheduled Tasks</h2></div>';

        // ── Stats cards ──
        var statsDiv = document.createElement('div');
        statsDiv.className = 'task-stats';
        statsDiv.innerHTML =
            '<div class="task-stat"><div class="task-stat-value">' + (stats.activeTasks || 0) + '</div><div class="task-stat-label">Active Tasks</div></div>' +
            '<div class="task-stat"><div class="task-stat-value">' + (stats.totalRuns || 0) + '</div><div class="task-stat-label">Total Runs</div></div>' +
            '<div class="task-stat"><div class="task-stat-value green">' + (stats.completedRuns || 0) + '</div><div class="task-stat-label">Succeeded</div></div>' +
            '<div class="task-stat"><div class="task-stat-value red">' + (stats.failedRuns || 0) + '</div><div class="task-stat-label">Failed</div></div>';
        container.appendChild(statsDiv);

        // ── All tasks section — grouped by status ──
        var activeTasks = tasks.filter(function(t) { return t.status === 'active' || t.status === 'paused' || t.status === 'running'; });
        var inactiveTasks = tasks.filter(function(t) { return t.status !== 'active' && t.status !== 'paused' && t.status !== 'running'; });

        if (activeTasks.length > 0) {
            var titleEl = document.createElement('div');
            titleEl.className = 'task-section-title';
            titleEl.textContent = 'Active Tasks';
            container.appendChild(titleEl);
            activeTasks.forEach(function(t) {
                container.appendChild(buildTaskCard(t));
            });
        }

        if (inactiveTasks.length > 0) {
            var titleEl2 = document.createElement('div');
            titleEl2.className = 'task-section-title';
            titleEl2.textContent = 'Past Tasks';
            container.appendChild(titleEl2);
            inactiveTasks.forEach(function(t) {
                container.appendChild(buildTaskCard(t));
            });
        }

        if (tasks.length === 0) {
            var emptyTasks = document.createElement('div');
            emptyTasks.className = 'task-empty';
            emptyTasks.innerHTML =
                '<div class="task-empty-icon">\uD83D\uDCED</div>' +
                '<div class="task-empty-text">No scheduled tasks</div>' +
                '<div class="task-empty-sub">Ask OwnClaw to schedule or remind you about something</div>';
            container.appendChild(emptyTasks);
        }

        // ── Execution history section ──
        var histTitle = document.createElement('div');
        histTitle.className = 'task-section-title';
        histTitle.textContent = 'Execution History';
        container.appendChild(histTitle);

        if (!runs || runs.length === 0) {
            var emptyRuns = document.createElement('div');
            emptyRuns.className = 'task-empty';
            emptyRuns.innerHTML =
                '<div class="task-empty-icon">\uD83D\uDCED</div>' +
                '<div class="task-empty-text">No task executions yet</div>' +
                '<div class="task-empty-sub">Scheduled tasks will appear here after they run</div>';
            container.appendChild(emptyRuns);
        } else {
            runs.forEach(function(run) {
                container.appendChild(buildTaskRunElement(run));
            });
            if (runs.length >= 50) {
                var loadMore = document.createElement('button');
                loadMore.className = 'task-load-more';
                loadMore.textContent = 'Load more...';
                loadMore.addEventListener('click', function() {
                    loadMoreRuns(runs.length, container, loadMore);
                });
                container.appendChild(loadMore);
            }
        }

        messagesEl.insertBefore(container, thinkingEl);
        scrollBottom();
    }

    function buildTaskCard(t) {
        var card = document.createElement('div');
        var isInactive = (t.status !== 'active' && t.status !== 'paused' && t.status !== 'running');
        card.className = 'active-task-card' + (isInactive ? ' inactive' : '');
        card.setAttribute('data-task-id', t.id);

        var typeClass = t.task_type === 'recurring' ? 'recurring' : 'deferred';

        // ── Header row with actions ──
        var header = document.createElement('div');
        header.className = 'active-task-card-header';

        // Build action buttons based on status
        var actionsHtml = '<div class="task-card-actions">';
        if (t.status === 'active') {
            actionsHtml += '<button class="task-action-btn" data-action="pause" title="Pause">\u23F8</button>';
            actionsHtml += '<button class="task-action-btn" data-action="edit" title="Edit">\u270F\uFE0F</button>';
            actionsHtml += '<button class="task-action-btn danger" data-action="cancel" title="Cancel">\u26D4</button>';
        } else if (t.status === 'paused') {
            actionsHtml += '<button class="task-action-btn success" data-action="resume" title="Resume">\u25B6\uFE0F</button>';
            actionsHtml += '<button class="task-action-btn" data-action="edit" title="Edit">\u270F\uFE0F</button>';
            actionsHtml += '<button class="task-action-btn danger" data-action="cancel" title="Cancel">\u26D4</button>';
        }
        if (t.status !== 'running') {
            actionsHtml += '<button class="task-action-btn danger" data-action="delete" title="Delete permanently">\uD83D\uDDD1\uFE0F</button>';
        }
        actionsHtml += '</div>';

        header.innerHTML =
            '<span class="active-task-type ' + typeClass + '">' + escapeHtml(t.task_type) + '</span>' +
            '<span class="task-status-badge ' + escapeHtml(t.status) + '">' + escapeHtml(t.status) + '</span>' +
            '<span class="active-task-desc">' + escapeHtml(t.description || 'Untitled task') + '</span>' +
            actionsHtml +
            '<span class="task-card-toggle">\u25BC</span>';

        card.appendChild(header);

        // ── Meta row ──
        var nextRun = t.next_run_at ? formatTime(t.next_run_at) : '\u2014';
        var cronStr = t.cron_expression ? '<span class="task-tag">\uD83D\uDD04 ' + escapeHtml(t.cron_expression) + '</span>' : '';
        var runsStr = t.run_count ? '<span class="task-tag">\u25B6 ' + t.run_count + ' runs</span>' : '';
        var maxStr = t.max_runs ? '<span class="task-tag">\uD83C\uDFAF max ' + t.max_runs + '</span>' : '';
        var metaDiv = document.createElement('div');
        metaDiv.className = 'active-task-meta';
        metaDiv.innerHTML =
            '<span class="task-tag">\uD83D\uDD52 Next: ' + nextRun + '</span>' +
            cronStr + runsStr + maxStr +
            '<span class="task-tag">Created: ' + formatTime(t.created_at) + '</span>';
        card.appendChild(metaDiv);

        // ── Expandable detail section ──
        var detail = document.createElement('div');
        detail.className = 'task-card-detail';
        var detailHtml =
            '<div class="task-detail-row"><span class="task-detail-label">Task ID</span><span class="task-detail-value">#' + t.id + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Description</span><span class="task-detail-value">' + escapeHtml(t.description || '') + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Type</span><span class="task-detail-value">' + escapeHtml(t.task_type) + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Status</span><span class="task-detail-value">' + escapeHtml(t.status) + '</span></div>';
        if (t.cron_expression) {
            detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Schedule</span><span class="task-detail-value">' + escapeHtml(t.cron_expression) + '</span></div>';
        }
        if (t.next_run_at) {
            detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Next run</span><span class="task-detail-value">' + new Date(t.next_run_at + 'Z').toLocaleString() + '</span></div>';
        }
        if (t.last_run_at) {
            detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Last run</span><span class="task-detail-value">' + new Date(t.last_run_at + 'Z').toLocaleString() + '</span></div>';
        }
        detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Run count</span><span class="task-detail-value">' + (t.run_count || 0) + (t.max_runs ? ' / ' + t.max_runs : '') + '</span></div>';
        if (t.last_result) {
            detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Last result</span></div>' +
                '<div class="task-result-content">' + escapeHtml(t.last_result) + '</div>';
        }
        if (t.last_error) {
            detailHtml += '<div class="task-detail-row"><span class="task-detail-label">Last error</span></div>' +
                '<div class="task-result-content" style="border-color:var(--red-dim);color:var(--red)">' + escapeHtml(t.last_error) + '</div>';
        }
        detail.innerHTML = detailHtml;
        card.appendChild(detail);

        // ── Event: toggle expand ──
        header.querySelector('.task-card-toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            card.classList.toggle('expanded');
        });

        // ── Event: action buttons ──
        header.querySelectorAll('.task-action-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var action = btn.getAttribute('data-action');
                if (action === 'edit') {
                    showEditTaskModal(t);
                } else if (action === 'delete') {
                    if (confirm('Permanently delete task #' + t.id + '? This also deletes its run history.')) {
                        taskAction('DELETE', '/api/scheduled-tasks/' + t.id);
                    }
                } else if (action === 'cancel') {
                    if (confirm('Cancel task #' + t.id + '? History will be preserved.')) {
                        taskAction('PUT', '/api/scheduled-tasks/' + t.id + '/cancel');
                    }
                } else if (action === 'pause') {
                    taskAction('PUT', '/api/scheduled-tasks/' + t.id + '/pause');
                } else if (action === 'resume') {
                    taskAction('PUT', '/api/scheduled-tasks/' + t.id + '/resume');
                }
            });
        });

        return card;
    }

    function taskAction(method, url, body) {
        if (!authToken) return;
        var opts = {
            method: method,
            headers: { 'Authorization': 'Bearer ' + authToken }
        };
        if (body) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        fetch(url, opts)
        .then(function(r) {
            if (!r.ok) throw new Error('Request failed: ' + r.status);
            return r.json();
        })
        .then(function() {
            // Reload the task history view
            loadTaskHistory();
        })
        .catch(function(e) {
            console.error('Task action failed:', e);
            alert('Action failed: ' + e.message);
        });
    }

    function showEditTaskModal(task) {
        // Remove any existing modal
        var existing = document.querySelector('.task-modal-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.className = 'task-modal-overlay';

        var isRecurring = task.task_type === 'recurring';
        var modalHtml =
            '<div class="task-modal">' +
                '<h3>\u270F\uFE0F Edit Task #' + task.id + '</h3>' +
                '<div class="task-modal-field">' +
                    '<label>Description</label>' +
                    '<textarea id="edit-task-desc">' + escapeHtml(task.description || '') + '</textarea>' +
                '</div>';
        if (isRecurring) {
            modalHtml +=
                '<div class="task-modal-field">' +
                    '<label>Cron Expression</label>' +
                    '<input type="text" id="edit-task-cron" value="' + escapeHtml(task.cron_expression || '') + '">' +
                    '<div class="field-hint">Spring cron format: sec min hour day month weekday (e.g. 0 0 9 * * MON-FRI)</div>' +
                '</div>';
        }
        modalHtml +=
                '<div class="task-modal-error" id="edit-task-error"></div>' +
                '<div class="task-modal-actions">' +
                    '<button class="task-modal-btn secondary" id="edit-task-cancel">Cancel</button>' +
                    '<button class="task-modal-btn primary" id="edit-task-save">Save Changes</button>' +
                '</div>' +
            '</div>';

        overlay.innerHTML = modalHtml;
        document.body.appendChild(overlay);

        // Close on overlay click
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        // Close on Escape
        var escHandler = function(e) {
            if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); }
        };
        document.addEventListener('keydown', escHandler);

        document.getElementById('edit-task-cancel').addEventListener('click', function() {
            overlay.remove();
        });

        document.getElementById('edit-task-save').addEventListener('click', function() {
            var desc = document.getElementById('edit-task-desc').value.trim();
            var cron = isRecurring ? document.getElementById('edit-task-cron').value.trim() : null;
            var errorEl = document.getElementById('edit-task-error');
            errorEl.textContent = '';

            if (!desc) {
                errorEl.textContent = 'Description is required';
                return;
            }

            var body = { description: desc };
            if (cron !== null) body.cronExpression = cron;

            var saveBtn = document.getElementById('edit-task-save');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            fetch('/api/scheduled-tasks/' + task.id, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + authToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })
            .then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Update failed'); });
                return r.json();
            })
            .then(function() {
                overlay.remove();
                loadTaskHistory();
            })
            .catch(function(e) {
                errorEl.textContent = e.message;
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            });
        });

        // Focus description
        document.getElementById('edit-task-desc').focus();
    }

    function buildTaskRunElement(run) {
        var runEl = document.createElement('div');
        runEl.className = 'task-run';

        var durationStr = run.duration_ms != null ? formatDuration(run.duration_ms) : '\u2014';
        var timeStr = run.executed_at ? formatTime(run.executed_at) : '\u2014';
        var statusClass = run.status || 'completed';
        var statusIcon = statusClass === 'completed' ? '\u2705' : '\u274C';

        // Header (clickable)
        var header = document.createElement('div');
        header.className = 'task-run-header';
        header.innerHTML =
            '<div class="task-run-status ' + statusClass + '"></div>' +
            '<div class="task-run-desc">' + escapeHtml(run.description || 'Task #' + run.task_id) + '</div>' +
            '<div class="task-run-meta">' +
                '<span>' + timeStr + '</span>' +
                '<span class="task-run-duration">' + durationStr + '</span>' +
            '</div>' +
            '<span class="task-run-toggle">\u25BC</span>';

        header.addEventListener('click', function() {
            runEl.classList.toggle('expanded');
        });
        runEl.appendChild(header);

        // Expandable details
        var details = document.createElement('div');
        details.className = 'task-run-details';

        var detailsHtml =
            '<div class="task-detail-row"><span class="task-detail-label">Status</span><span class="task-detail-value ' + (statusClass === 'failed' ? 'error' : 'success') + '">' + statusIcon + ' ' + (run.status || 'unknown') + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Task ID</span><span class="task-detail-value">#' + (run.task_id || '\u2014') + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Type</span><span class="task-detail-value">' + (run.task_type || '\u2014') + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Run #</span><span class="task-detail-value">' + (run.run_number || '\u2014') + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Duration</span><span class="task-detail-value">' + durationStr + '</span></div>' +
            '<div class="task-detail-row"><span class="task-detail-label">Executed</span><span class="task-detail-value">' + (run.executed_at ? new Date(run.executed_at + 'Z').toLocaleString() : '\u2014') + '</span></div>';

        if (run.cron_expression) {
            detailsHtml += '<div class="task-detail-row"><span class="task-detail-label">Schedule</span><span class="task-detail-value">' + escapeHtml(run.cron_expression) + '</span></div>';
        }

        if (run.skills_used) {
            detailsHtml += '<div class="task-detail-row"><span class="task-detail-label">Skills</span><span class="task-detail-value">' + escapeHtml(run.skills_used) + '</span></div>';
        }

        if (run.result) {
            detailsHtml += '<div class="task-detail-row"><span class="task-detail-label">Result</span></div>' +
                '<div class="task-result-content">' + escapeHtml(run.result) + '</div>';
        }

        if (run.error) {
            detailsHtml += '<div class="task-detail-row"><span class="task-detail-label">Error</span></div>' +
                '<div class="task-result-content" style="border-color:var(--red-dim);color:var(--red)">' + escapeHtml(run.error) + '</div>';
        }

        details.innerHTML = detailsHtml;
        runEl.appendChild(details);

        return runEl;
    }

    function loadMoreRuns(offset, container, btn) {
        if (!authToken) return;
        btn.textContent = 'Loading...';
        btn.disabled = true;
        fetch('/api/scheduled-tasks/runs?limit=50&offset=' + offset, {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var runs = data.runs || [];
            runs.forEach(function(run) {
                container.insertBefore(buildTaskRunElement(run), btn);
            });
            if (runs.length < 50) {
                btn.remove();
            } else {
                btn.textContent = 'Load more...';
                btn.disabled = false;
                btn.onclick = function() { loadMoreRuns(offset + runs.length, container, btn); };
            }
        })
        .catch(function(e) {
            console.error('Failed to load more runs:', e);
            btn.textContent = 'Load more...';
            btn.disabled = false;
        });
    }

    function formatDuration(ms) {
        if (ms < 1000) return ms + 'ms';
        var sec = Math.floor(ms / 1000);
        if (sec < 60) return sec + 's';
        var min = Math.floor(sec / 60);
        var s = sec % 60;
        if (min < 60) return min + 'm ' + s + 's';
        var hr = Math.floor(min / 60);
        var m = min % 60;
        return hr + 'h ' + m + 'm';
    }

    function saveSettings(originalData) {
        var payload = {};

        // Provider
        var provider = document.getElementById('settings-provider').value;
        if (provider !== originalData.cloud_provider) payload.cloud_provider = provider;

        // OpenAI key (only if changed — field was unlocked)
        var openaiKeyInp = document.getElementById('settings-openai-key');
        if (!openaiKeyInp.readOnly && openaiKeyInp.value.trim()) {
            payload.openai_api_key = openaiKeyInp.value.trim();
        }

        // OpenAI model
        var openaiModel = document.getElementById('settings-openai-model').value.trim();
        if (openaiModel !== (originalData.openai_model || '')) payload.openai_model = openaiModel;

        // Anthropic key
        var anthropicKeyInp = document.getElementById('settings-anthropic-key');
        if (!anthropicKeyInp.readOnly && anthropicKeyInp.value.trim()) {
            payload.anthropic_api_key = anthropicKeyInp.value.trim();
        }

        // Anthropic model
        var anthropicModel = document.getElementById('settings-anthropic-model').value.trim();
        if (anthropicModel !== (originalData.anthropic_model || '')) payload.anthropic_model = anthropicModel;

        // Ollama
        var ollamaUrl = document.getElementById('settings-ollama-url').value.trim();
        if (ollamaUrl !== (originalData.ollama_url || '')) payload.ollama_url = ollamaUrl;

        var ollamaModel = document.getElementById('settings-ollama-model').value.trim();
        if (ollamaModel !== (originalData.ollama_model || '')) payload.ollama_model = ollamaModel;

        if (Object.keys(payload).length === 0) {
            showSettingsToast('No changes to save', false);
            return;
        }

        var btn = document.getElementById('settings-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        fetch('/api/settings', {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + authToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(function(r) {
            if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Save failed'); });
            return r.json();
        })
        .then(function() {
            showSettingsToast('Settings saved successfully', false);
            // Reload to reflect new masked keys and statuses
            setTimeout(function() { loadSettings(); }, 600);
        })
        .catch(function(e) {
            showSettingsToast(e.message, true);
            btn.disabled = false;
            btn.textContent = 'Save Settings';
        });
    }

    function showSettingsToast(msg, isError) {

        if (existing) existing.remove();
        var toast = document.createElement('div');

        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }

    function renderSkillsList(skills) {
        var view = document.createElement('div');
        view.className = 'skills-view';

        // ── Header ──
        var header = document.createElement('div');
        header.className = 'skills-header';
        header.innerHTML =
            '<h2>\uD83E\uDDE9 Skills (' + skills.length + ')</h2>' +
            '<div class="skills-header-actions">' +
                '<button class="skills-reload-btn" id="skills-reload-btn">\u21BB Reload All</button>' +
            '</div>';
        view.appendChild(header);

        // ── Stats summary ──
        if (skills.length > 0) {
            var totalInvocations = 0;
            var totalSuccesses = 0;
            var withNetwork = 0;
            var withCredentials = 0;
            skills.forEach(function(s) {
                totalInvocations += (s.totalInvocations || 0);
                totalSuccesses += (s.successes || 0);
                if (s.requiresNetwork) withNetwork++;
                if (s.requiredCredentials && s.requiredCredentials.length > 0) withCredentials++;
            });
            var statsDiv = document.createElement('div');
            statsDiv.className = 'skills-stats';
            statsDiv.innerHTML =
                '<div class="task-stat"><div class="task-stat-value">' + skills.length + '</div><div class="task-stat-label">Total Skills</div></div>' +
                '<div class="task-stat"><div class="task-stat-value">' + totalInvocations + '</div><div class="task-stat-label">Total Runs</div></div>' +
                '<div class="task-stat"><div class="task-stat-value green">' + (totalInvocations > 0 ? Math.round(totalSuccesses / totalInvocations * 100) : 0) + '%</div><div class="task-stat-label">Success Rate</div></div>' +
                '<div class="task-stat"><div class="task-stat-value">' + withNetwork + '</div><div class="task-stat-label">Network Skills</div></div>';
            view.appendChild(statsDiv);
        }

        // ── Skill cards grid ──
        if (skills.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'skills-empty';
            empty.innerHTML =
                '<div class="skills-empty-icon">\uD83E\uDDE9</div>' +
                '<div class="skills-empty-text">No skills yet</div>' +
                '<div class="skills-empty-sub">Ask OwnClaw to create a skill in the chat</div>';
            view.appendChild(empty);
        } else {
            var grid = document.createElement('div');
            grid.className = 'skills-grid';

            skills.forEach(function(skill) {
                var card = document.createElement('div');
                card.className = 'skill-card';
                card.setAttribute('data-skill-name', skill.name);

                // Tags
                var tagsHtml = '';
                if (skill.requiresNetwork) tagsHtml += '<span class="skill-tag network">\uD83C\uDF10 Network</span>';
                if (skill.hasSideEffects) tagsHtml += '<span class="skill-tag side-effect">\u26A1 Side Effects</span>';
                if (skill.requiredCredentials && skill.requiredCredentials.length > 0) {
                    tagsHtml += '<span class="skill-tag credentials">\uD83D\uDD11 Credentials</span>';
                }

                // Stats
                var statsHtml = '';
                if (skill.totalInvocations > 0) {
                    statsHtml += '<span class="skill-card-stat">\u25B6 ' + skill.totalInvocations + ' runs</span>';
                    statsHtml += '<span class="skill-card-stat">\u2705 ' + skill.successRate + '%</span>';
                    if (skill.avgDurationMs) statsHtml += '<span class="skill-card-stat">\u23F1 ' + formatDuration(skill.avgDurationMs) + '</span>';
                } else {
                    statsHtml = '<span class="skill-card-stat">Never invoked</span>';
                }

                // Actions
                var actionsHtml =
                    '<div class="skill-card-actions">' +
                        '<button class="task-action-btn" data-action="run" title="Test Run">\u25B6\uFE0F</button>' +
                        '<button class="task-action-btn danger" data-action="delete" title="Delete">\uD83D\uDDD1\uFE0F</button>' +
                    '</div>';

                // Param count
                var paramCount = skill.parameters ? skill.parameters.length : 0;
                var paramStr = paramCount > 0 ? paramCount + ' param' + (paramCount > 1 ? 's' : '') : 'no params';

                card.innerHTML =
                    actionsHtml +
                    '<div class="skill-card-name"><span class="skill-icon">\uD83D\uDC0D</span>' + escapeHtml(skill.name) + '</div>' +
                    '<div class="skill-card-desc">' + escapeHtml(skill.description || '') + '</div>' +
                    '<div class="skill-card-tags">' + tagsHtml + '</div>' +
                    '<div class="skill-card-stats">' +
                        '<span class="skill-card-stat">\uD83D\uDCE6 ' + paramStr + '</span>' +
                        statsHtml +
                    '</div>';

                // Click card to view detail
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.task-action-btn')) return;
                    loadSkillDetail(skill.name);
                });

                // Action buttons
                card.querySelectorAll('.task-action-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var action = btn.getAttribute('data-action');
                        if (action === 'run') {
                            showSkillRunModal(skill.name);
                        } else if (action === 'delete') {
                            if (confirm('Permanently delete skill "' + skill.name + '"? This cannot be undone.')) {
                                deleteSkill(skill.name);
                            }
                        }
                    });
                });

                grid.appendChild(card);
            });

            view.appendChild(grid);
        }

        messagesEl.insertBefore(view, thinkingEl);
        scrollBottom();

        // Wire reload button
        document.getElementById('skills-reload-btn').addEventListener('click', function() {
            var btn = this;
            btn.disabled = true;
            btn.textContent = 'Reloading...';
            fetch('/api/skills/reload', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authToken }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {

                loadSkills();
            })
            .catch(function(e) {
                showSettingsToast('Reload failed: ' + e.message, true);
                btn.disabled = false;
                btn.textContent = '\u21BB Reload All';
            });
        });
    }

    function renderSkillDetail(skill) {
        var view = document.createElement('div');

                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    }

    function saveSkill(originalSkill) {
        var code = document.getElementById('skill-edit-code').value;
        var desc = document.getElementById('skill-edit-desc').value.trim();
        var timeout = parseInt(document.getElementById('skill-edit-timeout').value) || 30;
        var requiresNetwork = document.getElementById('skill-edit-network').checked;
        var hasSideEffects = document.getElementById('skill-edit-sideeffects').checked;
        var credentials = document.getElementById('skill-edit-creds').value.trim();
        var systemPackages = document.getElementById('skill-edit-pkgs').value.trim();
        var requirements = document.getElementById('skill-edit-reqs').value.trim();

        if (!desc) {
            showSettingsToast('Description is required', true);
            return;
        }
        if (!code.trim()) {
            showSettingsToast('Code is required', true);
            return;
        }

        var btn = document.getElementById('skill-detail-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        // Build parameters from original (can't edit params through this UI, keep original)
        var params = originalSkill.parameters || {};

        fetch('/api/skills/' + encodeURIComponent(originalSkill.name), {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + authToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                description: desc,
                code: code,
                parameters: params,
                timeout: timeout,
                requiresNetwork: requiresNetwork,
                hasSideEffects: hasSideEffects,
                credentials: credentials,
                systemPackages: systemPackages,
                requirements: requirements
            })
        })
        .then(function(r) {
            if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Save failed'); });
            return r.json();
        })
        .then(function(data) {
            showSettingsToast(data.message || 'Skill saved', false);
            // Reload detail to reflect changes
            setTimeout(function() { loadSkillDetail(originalSkill.name); }, 600);
        })
        .catch(function(e) {
            showSettingsToast(e.message, true);
            btn.disabled = false;
            btn.textContent = 'Save Changes';
        });
    }

    function deleteSkill(name) {
        if (!authToken) return;
        fetch('/api/skills/' + encodeURIComponent(name), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) {
            if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Delete failed'); });
            return r.json();
        })
        .then(function(data) {
            showSettingsToast(data.message || 'Skill deleted', false);
            loadSkills();
        })
        .catch(function(e) {
            showSettingsToast(e.message, true);
        });
    }

    function showSkillRunModal(name) {
        if (!authToken) return;

        // First fetch skill detail to get parameters
        fetch('/api/skills/' + encodeURIComponent(name), {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(skill) {
            // Build modal
            var existing = document.querySelector('.skill-run-overlay');
            if (existing) existing.remove();

            var overlay = document.createElement('div');
            overlay.className = 'skill-run-overlay';

            var params = skill.parameters || {};
            var paramKeys = Object.keys(params);

            var fieldsHtml = '';
            paramKeys.forEach(function(key) {
                var p = params[key] || {};
                var pType = p.type || 'string';
                var pDesc = p.description || '';
                var required = p.required ? ' *' : '';
                fieldsHtml +=
                    '<div class="task-modal-field">' +
                        '<label>' + escapeHtml(key) + required + ' <span style="color:var(--text-3);font-weight:400">(' + pType + ')</span></label>' +
                        '<input type="text" class="skill-run-param" data-param="' + escapeHtml(key) + '" placeholder="' + escapeHtml(pDesc) + '">' +
                    '</div>';
            });

            if (paramKeys.length === 0) {
                fieldsHtml = '<div style="color:var(--text-3);font-size:13px;margin-bottom:14px">This skill takes no parameters</div>';
            }

            overlay.innerHTML =
                '<div class="skill-run-modal">' +
                    '<h3>\u25B6\uFE0F Test Run: ' + escapeHtml(name) + '</h3>' +
                    '<div style="color:var(--text-2);font-size:12px;margin-bottom:16px">' + escapeHtml(skill.description || '') + '</div>' +
                    fieldsHtml +
                    '<div class="task-modal-actions">' +
                        '<button class="task-modal-btn secondary" id="skill-run-cancel">Cancel</button>' +
                        '<button class="task-modal-btn primary" id="skill-run-execute">\u25B6 Run</button>' +
                    '</div>' +
                    '<div id="skill-run-result" style="display:none"></div>' +
                '</div>';

            document.body.appendChild(overlay);

            // Close handlers
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.remove();
            });
            var escHandler = function(e) {
                if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); }
            };
            document.addEventListener('keydown', escHandler);

            document.getElementById('skill-run-cancel').addEventListener('click', function() {
                overlay.remove();
            });

            document.getElementById('skill-run-execute').addEventListener('click', function() {
                var runBtn = this;
                runBtn.disabled = true;
                runBtn.textContent = 'Running...';

                // Collect params
                var runParams = {};
                overlay.querySelectorAll('.skill-run-param').forEach(function(inp) {
                    var val = inp.value.trim();
                    if (val) runParams[inp.getAttribute('data-param')] = val;
                });

                var resultDiv = document.getElementById('skill-run-result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<div class="task-history-loading" style="padding:16px"><div class="mini-spinner"></div><span>Executing...</span></div>';

                fetch('/api/skills/' + encodeURIComponent(name) + '/run', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ params: runParams })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var statusClass = data.success ? 'success' : 'error';
                    resultDiv.innerHTML =
                        '<div class="skill-run-output ' + statusClass + '">' + escapeHtml(data.output || '(no output)') + '</div>' +
                        '<div class="skill-run-duration">' + (data.success ? '\u2705' : '\u274C') + ' ' + formatDuration(data.durationMs || 0) + '</div>';
                    runBtn.disabled = false;
                    runBtn.textContent = '\u25B6 Run Again';
                })
                .catch(function(e) {
                    resultDiv.innerHTML =
                        '<div class="skill-run-output error">Error: ' + escapeHtml(e.message) + '</div>';
                    runBtn.disabled = false;
                    runBtn.textContent = '\u25B6 Run';
                });
            });
        })
        .catch(function(e) {
            showSettingsToast('Failed to load skill: ' + e.message, true);
        });
    }


    function renameSession(sessionId, newTitle) {
        if (!authToken) return;
        // Optimistic UI: update title immediately
        var itemEl = sessionListEl.querySelector('.session-item[data-session-id="' + sessionId + '"]');
        var oldTitle = '';
        if (itemEl) {
            var titleEl = itemEl.querySelector('.session-title');
            if (titleEl) {
                oldTitle = titleEl.textContent;
                titleEl.textContent = newTitle;
            }
            itemEl.classList.add('renaming');
        }
        fetch('/api/chats/' + sessionId, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle })
        })
        .then(function() {
            if (itemEl) itemEl.classList.remove('renaming');
            refreshSessionList();
        })
        .catch(function(e) {
            console.error('Rename failed:', e);
            // Revert on failure
            if (itemEl) {
                itemEl.classList.remove('renaming');
                var titleEl = itemEl.querySelector('.session-title');
                if (titleEl) titleEl.textContent = oldTitle;
            }
        });
    }

    function deleteSession(sessionId) {
        if (!authToken) return;
        var wasActive = (sessionId === activeSessionId);

        // Optimistic UI: immediately mark the item as deleting, then fade out
        var itemEl = sessionListEl.querySelector('.session-item[data-session-id="' + sessionId + '"]');
        if (itemEl) {
            itemEl.classList.add('deleting');
            setTimeout(function() { itemEl.classList.add('fade-out'); }, 150);
        }
        if (wasActive) {
            clearMessages();
        }

        fetch('/api/chats/' + sessionId, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(resp) {
            if (!resp.ok) throw new Error('Delete failed: ' + resp.status);
            return resp.json();
        })
        .then(function(data) {
            // Server returns updated session list + activeSessionId
            renderSessionList(data.sessions || [], data.activeSessionId || '');
            if (wasActive && data.activeSessionId) {
                loadSessionMessages(data.activeSessionId);
            }
        })
        .catch(function(e) {
            console.error('Delete failed:', e);
            // Revert optimistic removal on failure
            if (itemEl) {
                itemEl.classList.remove('deleting', 'fade-out');
            }
            refreshSessionList();
        });
    }

    function refreshSessionList() {
        if (!authToken) return Promise.resolve();
        // Show loading spinner if session list is currently empty (initial load)
        if (!sessionListEl.querySelector('.session-item')) {
            sessionListEl.innerHTML = '<div class="session-loading"><div class="mini-spinner"></div><span>Loading chats...</span></div>';
        }
        return fetch('/api/chats', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderSessionList(data.sessions || [], data.activeSessionId);
        })
        .catch(function(e) {
            console.error('Failed to refresh sessions:', e);
            // Clear loading indicator on error
            var loader = sessionListEl.querySelector('.session-loading');
            if (loader) loader.remove();
        });
    }

    function formatTime(isoStr) {
        if (!isoStr) return '';
        try {
            var d = new Date(isoStr + 'Z');
            var now = new Date();
            var diff = now - d;
            if (diff < 60000) return 'just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
            return d.toLocaleDateString();
        } catch(e) { return isoStr; }
    }

    //  Activity log 
    activityHeader.addEventListener('click', function() {
        activityOpen = !activityOpen;
        activityStepsEl.classList.toggle('visible', activityOpen);
        activityToggle.classList.toggle('open', activityOpen);
    });

    function showActivity(text) {
        activityWrap.style.display = 'block';
        activitySpinner.classList.remove('done');
        activityLabel.textContent = text;
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        var step = document.createElement('div');
        step.className = 'activity-step latest';
        step.innerHTML = '<span class="step-dot"></span><span>' + escapeHtml(text) + '</span>';
        activityStepsEl.appendChild(step);
        activityStepsEl.scrollTop = activityStepsEl.scrollHeight;
        activityStepList.push(step);
        scrollBottom();
    }

    /** PROGRESS updates: overwrite the last step's text + label instead of adding a new step. */
    function updateActivity(text) {
        activityLabel.textContent = text;
        if (activityStepList.length > 0) {
            var last = activityStepList[activityStepList.length - 1];
            var span = last.querySelector('span:last-child');
            if (span) span.textContent = text;
        }
    }

    /** Update the live token counter in the activity header. */
    function updateTokens(data) {
        if (!data) return;
        var cloud = data.cloudTokens || 0;
        var local = data.localTokens || 0;
        var total = cloud + local;
        if (total === 0) { activityTokens.textContent = ''; return; }
        var parts = [];
        if (cloud > 0) parts.push(cloud.toLocaleString() + ' cloud');
        if (local > 0) parts.push(local.toLocaleString() + ' local');
        activityTokens.textContent = parts.join(' + ') + ' tok';
    }

    function doneActivity() {
        activitySpinner.classList.add('done');
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        setTimeout(function() {
            if (!activityOpen) {
                activityWrap.style.display = 'none';
                activityStepsEl.innerHTML = '';
                activityStepList = [];
                activityTokens.textContent = '';
            }
        }, 8000);
    }

    function resetActivity() {
        activityWrap.style.display = 'none';
        activityStepsEl.innerHTML = '';
        activityStepList = [];
        activityOpen = false;
        activityToggle.classList.remove('open');
        activityStepsEl.classList.remove('visible');
        activityTokens.textContent = '';
    }

    //  Auth flow 
    function checkAuth() {
        var headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        fetch('/api/auth/status', { headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.authenticated && authToken) { enterChat(); return; }
                if (authToken) { authToken = null; localStorage.removeItem('ownclaw_token'); }
                authLoading.style.display = 'none';
                authBox.style.display = 'block';
                if (data.hasUsers) switchToLogin(); else switchToRegister();
            })
            .catch(function() {
                authLoading.textContent = 'Cannot reach server - retrying...';
                setTimeout(checkAuth, 3000);
            });
    }

    function switchToRegister() {
        isRegisterMode = true;
        authTitle.textContent = 'Create your account';
        authSubtitle.textContent = 'Get started with OwnClaw';
        authSubmit.textContent = 'Create Account';
        authPassword.placeholder = 'Password (min 4 characters)';
        authPassword.autocomplete = 'new-password';
        authToggle.style.display = 'none';
        authError.style.display = 'none';
    }

    function switchToLogin() {
        isRegisterMode = false;
        authTitle.textContent = 'Welcome back';
        authSubtitle.textContent = 'Sign in to continue';
        authSubmit.textContent = 'Sign In';
        authPassword.placeholder = 'Password';
        authPassword.autocomplete = 'current-password';
        authToggle.style.display = 'block';
        authToggle.textContent = "Don't have an account? Register";
        authError.style.display = 'none';
    }

    authToggle.addEventListener('click', function() {
        if (isRegisterMode) switchToLogin(); else switchToRegister();
    });

    function doAuth() {
        var username = authUsername.value.trim();
        var password = authPassword.value;
        if (!username || password.length < 4) {
            showAuthError('Username required and password must be at least 4 characters');
            return;
        }
        authSubmit.disabled = true;
        authError.style.display = 'none';
        var endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(r) {
            return r.json().then(function(data) { return { ok: r.ok, data: data }; });
        })
        .then(function(res) {
            if (!res.ok) { showAuthError(res.data.error || 'Authentication failed'); authSubmit.disabled = false; return; }
            authToken = res.data.token;
            localStorage.setItem('ownclaw_token', authToken);
            enterChat();
        })
        .catch(function() {
            showAuthError('Network error - please try again');
            authSubmit.disabled = false;
        });
    }

    function showAuthError(msg) {
        authError.textContent = msg;
        authError.style.display = 'block';
    }

    function enterChat() {
        authOverlay.classList.add('hidden');
        connect();
    }

    function logout() {
        authToken = null;
        localStorage.removeItem('ownclaw_token');
        if (ws) { ws.close(); ws = null; }
        reconnectAttempt = 0;
        messagesEl.querySelectorAll('.msg').forEach(function(m) { m.remove(); });
        lastMsgSender = null;
        activeSessionId = null;
        sessionListEl.innerHTML = '';
        searchResults.innerHTML = '';
        searchResults.classList.remove('visible');
        searchInput.value = '';
        setConnState(false, 'Offline');
        hideConnBanner();
        resetActivity();
        authOverlay.classList.remove('hidden');
        authLoading.style.display = 'none';
        authBox.style.display = 'block';
        authUsername.value = '';
        authPassword.value = '';
        authSubmit.disabled = false;
        switchToLogin();
    }

    authSubmit.addEventListener('click', doAuth);
    authPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') doAuth(); });
    authUsername.addEventListener('keydown', function(e) { if (e.key === 'Enter') authPassword.focus(); });
    logoutBtn.addEventListener('click', logout);

    //  Connection state 
    function setConnState(online, label) {
        connPill.classList.toggle('online', online);
        connLabel.textContent = label || (online ? 'Connected' : 'Offline');
    }

    function showConnBanner(text) {
        connText.textContent = text;
        connBanner.classList.add('visible');
        scrollBottom();
    }
    function hideConnBanner() { connBanner.classList.remove('visible'); }

    //  WebSocket 
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(function() {
            try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' })); }
            catch(e) {}
        }, 25000);
    }
    function stopHeartbeat() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    function connect() {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var tokenParam = authToken ? '?token=' + encodeURIComponent(authToken) : '';
        ws = new WebSocket(proto + '//' + location.host + '/ws/chat' + tokenParam);
        needsInitialLoad = true;

        ws.onopen = function() {
            setConnState(true, 'Connected');
            hideConnBanner();
            startHeartbeat();
            reconnectAttempt = 0;
        };

        ws.onclose = function(e) {
            setConnState(false, 'Disconnected');
            setThinking(false);
            stopHeartbeat();
            if (e.code === 1008) { logout(); return; }
            reconnectAttempt++;
            var delay = Math.min(3000 * reconnectAttempt, 30000);
            setConnState(false, 'Reconnecting...');
            showConnBanner(reconnectAttempt === 1 ? 'Disconnected - reconnecting...' : 'Reconnecting... attempt ' + reconnectAttempt);
            setTimeout(connect, delay);
        };

        ws.onmessage = function(e) {
            try {
                var data = JSON.parse(e.data);
                var type    = data.type    || 'response';
                var content = data.content || '';
                if (type === 'session_info') {
                    // Session list update from server
                    renderSessionList(data.sessions || [], data.activeSessionId || '');
                    // Only load messages on initial connect / reconnect, not on every
                    // switch/new_session (those handle message loading themselves).
                    // Skip if user is viewing task history.
                    if (needsInitialLoad && data.activeSessionId && currentView === 'chat') {
                        loadSessionMessages(data.activeSessionId);
                        needsInitialLoad = false;
                    }
                } else if (type === 'session_updated') {
                    // A session was updated (new message, title change) — refresh sidebar
                    refreshSessionList();
                } else if (type === 'status') {
                    var sub = data.status || '';
                    // Update token counter whenever data.data has token info
                    if (data.data) updateTokens(data.data);
                    if (sub === 'completed' || sub === 'failed' || sub === 'rollback') {
                        showActivity(content);
                        setThinking(false);
                        doneActivity();
                    } else if (sub === 'progress') {
                        // PROGRESS updates the last step in-place (no new entry)
                        setThinking(true);
                        resetThinkingSafetyTimer();
                        updateActivity(content);
                    } else {
                        setThinking(true);
                        resetThinkingSafetyTimer();
                        showActivity(content);
                    }
                } else if (type === 'debug') {
                    addMsg('debug', content);
                } else if (type === 'pong' || type === 'ping') {
                    // heartbeat
                } else {
                    if (type === 'response') { setThinking(false); doneActivity(); }
                    addMsg(type, content);
                }
            } catch(ex) {
                setThinking(false);
                doneActivity();
                addMsg('response', e.data);
            }
        };
    }

    function setThinking(on) {
        if (thinkingSafetyTimer) { clearTimeout(thinkingSafetyTimer); thinkingSafetyTimer = null; }
        if (on) {
            thinkingEl.classList.add('active');
            sendBtn.disabled = true;
            stopBtn.classList.add('visible');
            scrollBottom();
            // Start elapsed timer
            if (!thinkingStartedAt) {
                thinkingStartedAt = Date.now();
                startElapsedTimer();
            }
            // Safety net: auto-hide if no messages arrive for 15 minutes
            thinkingSafetyTimer = setTimeout(function() {
                setThinking(false);
                doneActivity();
            }, 900000);
        } else {
            thinkingEl.classList.remove('active');
            sendBtn.disabled = false;
            stopBtn.classList.remove('visible');
            busy = false;
            thinkingStartedAt = null;
            stopElapsedTimer();
        }
    }

    function resetThinkingSafetyTimer() {
        if (thinkingSafetyTimer) {
            clearTimeout(thinkingSafetyTimer);
            thinkingSafetyTimer = setTimeout(function() {
                setThinking(false);
                doneActivity();
            }, 900000);
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        updateElapsed();
        elapsedTimer = setInterval(updateElapsed, 1000);
    }

    function stopElapsedTimer() {
        if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
        activityElapsed.textContent = '';
    }

    function updateElapsed() {
        if (!thinkingStartedAt) return;
        var sec = Math.floor((Date.now() - thinkingStartedAt) / 1000);
        if (sec < 60) {
            activityElapsed.textContent = sec + 's';
        } else {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            activityElapsed.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }
    }

    //  Message rendering 
    function addMsg(type, text) {
        var isUserMsg = type === 'user';
        var isAiMsg   = (type === 'response' || type === 'error' || type === 'question' || type === 'input_request' || type === 'debug');
        var senderKey = isUserMsg ? 'user' : (isAiMsg ? 'ai' : null);
        var firstInRun = senderKey !== null && senderKey !== lastMsgSender;
        if (senderKey) lastMsgSender = senderKey;

        var div = document.createElement('div');
        div.className = 'msg ' + type + (firstInRun ? ' first-in-run' : '');

        if (isUserMsg) {
            var bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(bubble);
        } else if (isAiMsg) {
            var avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = String.fromCodePoint(0x1F980);

            var body = document.createElement('div');
            body.className = 'msg-body md';
            body.innerHTML = renderMarkdown(text);
            body.querySelectorAll('pre').forEach(wrapCodeBlock);

            div.appendChild(avatar);
            div.appendChild(body);
        } else {
            div.innerHTML = renderMarkdown(text);
            div.classList.add('md');
            div.querySelectorAll('pre').forEach(wrapCodeBlock);
            if (text.indexOf('\n') === -1 && text.length < 80) div.classList.add('short');
        }

        messagesEl.insertBefore(div, thinkingEl);
        scrollBottom();
    }

    function renderMarkdown(text) {
        try { return marked.parse(text); }
        catch(e) { return '<p>' + escapeHtml(text) + '</p>'; }
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function wrapCodeBlock(pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrap';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = function() {
            var code = pre.querySelector('code');
            navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(function() {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        };
        wrapper.appendChild(btn);
    }

    //  Send 
    function send() {
        var text = inputEl.value.trim();
        if (!text || !ws || ws.readyState !== 1) return;
        addMsg('user', text);
        ws.send(JSON.stringify({ message: text }));
        inputEl.value = '';
        inputEl.style.height = 'auto';
        busy = true;
        resetActivity();
        setThinking(true);
    }

    function scrollBottom() {
        requestAnimationFrame(function() { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }

    inputEl.addEventListener('input', function() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    sendBtn.addEventListener('click', send);

    stopBtn.addEventListener('click', function() {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'cancel' }));
        }
        setThinking(false);
        doneActivity();
    });

    checkAuth();
})();
</script>
</body>
</html>
