<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnClaw</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:#0d0f14;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;
        }

        /* ── Auth overlay ──────────────────────────────────── */
        #auth-overlay{position:fixed;inset:0;background:#0d0f14;z-index:100;display:flex;
                      align-items:center;justify-content:center}
        #auth-overlay.hidden{display:none}
        #auth-box{
            background:linear-gradient(135deg,#161b27 0%,#141920 100%);
            border:1px solid #2a3140;border-radius:16px;padding:36px 32px;
            width:380px;max-width:92vw;
            box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
        }
        #auth-box h2{margin-bottom:6px;font-size:22px;text-align:center;letter-spacing:-.3px}
        #auth-box .subtitle{color:#64748b;font-size:13px;text-align:center;margin-bottom:24px}
        #auth-box input{
            width:100%;padding:11px 14px;border:1px solid #2a3140;border-radius:10px;
            background:#0d0f14;color:#e2e8f0;font-size:14px;outline:none;margin-bottom:10px;
            transition:border-color .15s,box-shadow .15s;
        }
        #auth-box input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.18)}
        #auth-box input::placeholder{color:#374151}
        #auth-submit{
            width:100%;padding:11px;
            background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);
            color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;
            cursor:pointer;margin-top:6px;transition:opacity .15s,transform .1s;
        }
        #auth-submit:hover{opacity:.9;transform:translateY(-1px)}
        #auth-submit:active{transform:translateY(0)}
        #auth-submit:disabled{background:#1e2433;color:#374151;cursor:not-allowed;transform:none}
        #auth-error{color:#f87171;font-size:13px;margin-top:10px;display:none;text-align:center}
        #auth-toggle{color:#6366f1;font-size:13px;text-align:center;margin-top:16px;cursor:pointer}
        #auth-toggle:hover{text-decoration:underline}
        .auth-loading{text-align:center;color:#64748b;padding:40px}

        /* ── Header ────────────────────────────────────────── */
        #header{
            padding:12px 20px;
            background:rgba(13,15,20,.95);
            border-bottom:1px solid #1e2433;
            backdrop-filter:blur(8px);
            display:flex;align-items:center;gap:10px;
            font-size:15px;font-weight:600;letter-spacing:-.2px;
        }
        #header .dot{width:8px;height:8px;border-radius:50%;background:#374151;flex-shrink:0;
                     transition:background .3s,box-shadow .3s}
        #header .dot.online{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.5)}
        #header .spacer{flex:1}
        #logout-btn{
            background:none;border:1px solid #2a3140;color:#64748b;
            padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer;
            transition:all .15s;
        }
        #logout-btn:hover{color:#f87171;border-color:#f87171;background:rgba(248,113,113,.06)}

        /* ── Messages area ─────────────────────────────────── */
        #messages{
            flex:1;overflow-y:auto;padding:24px 20px;
            display:flex;flex-direction:column;gap:0;
        }
        #messages::-webkit-scrollbar{width:5px}
        #messages::-webkit-scrollbar-thumb{background:#1e2433;border-radius:3px}
        #messages::-webkit-scrollbar-thumb:hover{background:#2a3140}

        /* Center all content in a comfortable reading width */
        .msg,.activity-wrap,#conn-banner,#thinking{
            max-width:min(100%,760px);
            width:100%;
            margin-left:auto;
            margin-right:auto;
        }

        /* ── Message bubbles ──────────────────────────────── */
        .msg{
            font-size:14.5px;line-height:1.7;
            animation:msgIn .2s cubic-bezier(.16,1,.3,1) both;
            overflow-wrap:anywhere;word-break:break-word;
            margin-bottom:4px;
        }
        @keyframes msgIn{
            from{opacity:0;transform:translateY(8px) scale(.99)}
            to{opacity:1;transform:none}
        }

        /* User messages */
        .msg.user{
            align-self:flex-end;
            background:linear-gradient(135deg,#4f46e5 0%,#6366f1 100%);
            color:#fff;padding:10px 16px;
            border-radius:18px 18px 4px 18px;
            white-space:pre-wrap;word-break:break-word;
            max-width:72%;
            box-shadow:0 4px 16px rgba(79,70,229,.3);
            margin-bottom:16px;
        }

        /* AI response messages */
        .msg.response{
            align-self:flex-start;
            background:#131720;
            border:1px solid #1e2433;
            border-radius:4px 18px 18px 18px;
            padding:14px 18px;
            margin-bottom:16px;
            position:relative;
        }
        .msg.response::before{
            content:'🦀';
            position:absolute;top:-10px;left:-4px;
            font-size:16px;line-height:1;
        }

        /* System / info messages */
        .msg.system{
            align-self:center;
            color:#94a3b8;font-size:13.5px;
            padding:12px 18px;
            background:#0f1219;
            border:1px solid #1e2433;
            border-radius:12px;
            max-width:min(100%,680px);
            margin-bottom:12px;
        }

        /* Error messages */
        .msg.error{
            align-self:flex-start;
            background:#1a0f14;
            border:1px solid #4b1c24;
            border-left:3px solid #f87171;
            border-radius:4px 12px 12px 12px;
            padding:12px 16px;
            color:#fca5a5;
            margin-bottom:16px;
        }

        /* Question / input request */
        .msg.question,.msg.input_request{
            align-self:flex-start;
            background:#0f1422;
            border:1px solid #1e3a5f;
            border-left:3px solid #6366f1;
            border-radius:4px 12px 12px 12px;
            padding:12px 16px;
            margin-bottom:16px;
        }

        /* Connection banner */
        #conn-banner{
            display:none;align-items:center;gap:8px;
            padding:8px 14px;margin:0 auto 12px;
            background:#0f1219;border:1px solid #1e2433;border-radius:10px;
            color:#64748b;font-size:12.5px;
        }
        #conn-banner.visible{display:flex}
        #conn-banner .spinner{
            width:13px;height:13px;border:2px solid #1e2433;
            border-top-color:#6366f1;border-radius:50%;
            animation:spin .8s linear infinite;flex-shrink:0;
        }
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ── Activity log (status messages) ─────────────────── */
        .activity-wrap{
            margin-bottom:8px;
            animation:msgIn .2s cubic-bezier(.16,1,.3,1) both;
        }
        #activity{
            background:#0f1219;
            border:1px solid #1e2433;
            border-radius:12px;
            overflow:hidden;
        }
        #activity-header{
            display:flex;align-items:center;gap:8px;
            padding:9px 14px;
            cursor:pointer;user-select:none;
            transition:background .12s;
        }
        #activity-header:hover{background:#131720}
        .activity-spinner{
            width:14px;height:14px;border:2px solid #1e2433;
            border-top-color:#6366f1;border-radius:50%;
            animation:spin .8s linear infinite;flex-shrink:0;
        }
        .activity-spinner.done{
            border-color:#34d399;border-top-color:transparent;
            animation:none;
        }
        #activity-label{flex:1;font-size:13px;color:#94a3b8;font-weight:500}
        .activity-toggle{font-size:11px;color:#374151;transition:transform .2s}
        .activity-toggle.open{transform:rotate(180deg)}
        #activity-steps{
            display:none;
            border-top:1px solid #1e2433;
            padding:6px 0;
            max-height:200px;overflow-y:auto;
        }
        #activity-steps::-webkit-scrollbar{width:3px}
        #activity-steps::-webkit-scrollbar-thumb{background:#2a3140;border-radius:2px}
        #activity-steps.visible{display:block}
        .activity-step{
            display:flex;align-items:flex-start;gap:10px;
            padding:4px 14px;
            font-size:12.5px;color:#64748b;
            line-height:1.5;
        }
        .activity-step .step-dot{
            width:5px;height:5px;border-radius:50%;background:#2a3140;
            flex-shrink:0;margin-top:6px;
        }
        .activity-step.latest .step-dot{background:#6366f1}
        .activity-step.latest{color:#94a3b8}

        /* ── Thinking indicator ─────────────────────────────── */
        #thinking{
            display:none;align-self:flex-start;
            padding:8px 0 2px;align-items:center;gap:8px;
            color:#64748b;font-size:13px;
        }
        #thinking.active{display:flex}
        .thinking-dots span{
            display:inline-block;width:7px;height:7px;border-radius:50%;
            background:#6366f1;
            animation:pulse 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1){animation-delay:0s}
        .thinking-dots span:nth-child(2){animation-delay:.18s}
        .thinking-dots span:nth-child(3){animation-delay:.36s}
        @keyframes pulse{
            0%,80%,100%{transform:scale(0);opacity:.3}
            40%{transform:scale(1);opacity:1}
        }

        /* ── Markdown rendering ─────────────────────────────── */
        .md p{margin:0 0 10px 0}
        .md p:last-child{margin-bottom:0}
        .md ul,.md ol{margin:4px 0 10px 20px}
        .md li{margin:3px 0}
        .md strong{color:#f1f5f9}
        .md em{color:#cbd5e1}
        .md a{color:#818cf8;text-decoration:none}
        .md a:hover{text-decoration:underline;color:#a5b4fc}
        .md blockquote{border-left:3px solid #2a3140;padding:2px 14px;margin:10px 0;color:#64748b}
        .md h1,.md h2,.md h3{margin:14px 0 6px;color:#f1f5f9;font-weight:600}
        .md h1{font-size:1.3em;border-bottom:1px solid #1e2433;padding-bottom:6px}
        .md h2{font-size:1.15em}
        .md h3{font-size:1.05em}
        .md hr{border:none;border-top:1px solid #1e2433;margin:14px 0}
        .md table{border-collapse:collapse;margin:10px 0;width:100%;display:block;overflow-x:auto}
        .md th,.md td{border:1px solid #1e2433;padding:7px 12px;text-align:left;font-size:13px}
        .md th{background:#131720;font-weight:600;color:#f1f5f9}
        .md tr:nth-child(even) td{background:#0c0f16}
        .md img{max-width:100%;height:auto;border-radius:8px;margin:6px 0}
        .md code{
            background:#1a1f2e;padding:2px 7px;border-radius:5px;font-size:13px;
            font-family:'Cascadia Code','Fira Code','JetBrains Mono',monospace;
            color:#a5b4fc;
        }
        .md pre{
            background:#0d0f14;border:1px solid #1e2433;border-radius:10px;
            padding:14px;margin:10px 0;overflow-x:auto;position:relative;
        }
        .md pre code{
            background:none;padding:0;font-size:13px;line-height:1.55;
            color:#e2e8f0;font-family:'Cascadia Code','Fira Code','JetBrains Mono',monospace;
        }

        /* Copy button on code blocks */
        .code-block-wrap{position:relative}
        .copy-btn{
            position:absolute;top:8px;right:8px;
            background:#1e2433;border:1px solid #2a3140;
            color:#64748b;padding:3px 10px;border-radius:6px;
            font-size:11px;cursor:pointer;
            opacity:0;transition:opacity .15s,color .15s;
        }
        .code-block-wrap:hover .copy-btn{opacity:1}
        .copy-btn:hover{background:#2a3140;color:#e2e8f0}
        .copy-btn.copied{color:#34d399}

        /* ── Input area ─────────────────────────────────────── */
        #input-area{
            padding:14px 20px 18px;
            background:rgba(13,15,20,.95);
            border-top:1px solid #1e2433;
        }
        .input-row{
            display:flex;gap:10px;align-items:flex-end;
            max-width:min(100%,760px);
            margin:0 auto;
        }
        #input{
            flex:1;padding:11px 16px;
            border:1px solid #2a3140;border-radius:14px;
            background:#0f1219;color:#e2e8f0;
            font-size:14px;outline:none;resize:none;
            max-height:140px;min-height:44px;line-height:1.5;
            font-family:inherit;
            transition:border-color .15s,box-shadow .15s;
        }
        #input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
        #input::placeholder{color:#374151}
        #send{
            width:44px;height:44px;flex-shrink:0;
            background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);
            color:#fff;border:none;border-radius:12px;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:opacity .15s,transform .1s,box-shadow .15s;
            box-shadow:0 4px 14px rgba(79,70,229,.4);
        }
        #send:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.5)}
        #send:active{transform:translateY(0)}
        #send:disabled{
            background:#1e2433;color:#374151;cursor:not-allowed;
            transform:none;box-shadow:none;
        }
        #send svg{width:18px;height:18px;fill:currentColor}

        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width:600px){
            #header{padding:10px 14px}
            #messages{padding:16px 14px}
            #input-area{padding:12px 14px 16px}
            .msg.user{max-width:85%}
        }
    </style>
</head>
<body>
    <!-- Auth overlay -->
    <div id="auth-overlay">
        <div class="auth-loading" id="auth-loading">Checking authentication...</div>
        <div id="auth-box" style="display:none">
            <h2 id="auth-title">Welcome to OwnClaw</h2>
            <div class="subtitle" id="auth-subtitle">Create your account to get started</div>
            <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password (min 4 characters)" autocomplete="new-password">
            <button id="auth-submit">Create Account</button>
            <div id="auth-error"></div>
            <div id="auth-toggle" style="display:none"></div>
        </div>
    </div>

    <div id="header">
        <span class="dot" id="connDot"></span>
        🦀 OwnClaw
        <span class="spacer"></span>
        <button id="logout-btn">Logout</button>
    </div>
    <div id="messages">
        <div id="conn-banner"><div class="spinner"></div><span id="conn-text"></span></div>
        <!-- Activity log: accumulates status messages during task execution -->
        <div class="activity-wrap" id="activity-wrap" style="display:none">
            <div id="activity">
                <div id="activity-header">
                    <div class="activity-spinner" id="activity-spinner"></div>
                    <span id="activity-label">Working...</span>
                    <span class="activity-toggle" id="activity-toggle">▾</span>
                </div>
                <div id="activity-steps"></div>
            </div>
        </div>
        <div id="thinking">
            <div class="thinking-dots"><span></span><span></span><span></span></div>
            <span id="thinking-text">Thinking...</span>
        </div>
    </div>
    <div id="input-area">
        <div class="input-row">
            <textarea id="input" rows="1" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)" autocomplete="off"></textarea>
            <button id="send">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
    <script>
    (function() {
        // ── DOM refs ──────────────────────────────────────────
        const authOverlay = document.getElementById('auth-overlay');
        const authLoading = document.getElementById('auth-loading');
        const authBox = document.getElementById('auth-box');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const authSubmit = document.getElementById('auth-submit');
        const authError = document.getElementById('auth-error');
        const authToggle = document.getElementById('auth-toggle');
        const logoutBtn = document.getElementById('logout-btn');

        const messagesEl = document.getElementById('messages');
        const thinkingEl = document.getElementById('thinking');
        const thinkingText = document.getElementById('thinking-text');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const connDot = document.getElementById('connDot');
        const connBanner = document.getElementById('conn-banner');
        const connText = document.getElementById('conn-text');

        const activityWrap = document.getElementById('activity-wrap');
        const activitySpinner = document.getElementById('activity-spinner');
        const activityLabel = document.getElementById('activity-label');
        const activitySteps = document.getElementById('activity-steps');
        const activityToggle = document.getElementById('activity-toggle');
        const activityHeader = document.getElementById('activity-header');

        let reconnectAttempt = 0;
        let authToken = localStorage.getItem('ownclaw_token');
        let isRegisterMode = true;
        let activityStepList = [];
        let activityOpen = false;

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch {}
                }
                try { return hljs.highlightAuto(code).value; } catch {}
                return code;
            }
        });

        let ws;
        let busy = false;

        // ── Activity log ──────────────────────────────────────

        activityHeader.addEventListener('click', () => {
            activityOpen = !activityOpen;
            activitySteps.classList.toggle('visible', activityOpen);
            activityToggle.classList.toggle('open', activityOpen);
        });

        function showActivity(text) {
            activityWrap.style.display = 'block';
            activitySpinner.classList.remove('done');
            activityLabel.textContent = text;
            activityStepList.forEach(s => s.classList.remove('latest'));
            const step = document.createElement('div');
            step.className = 'activity-step latest';
            step.innerHTML = '<span class="step-dot"></span><span>' + escapeHtml(text) + '</span>';
            activitySteps.appendChild(step);
            activitySteps.scrollTop = activitySteps.scrollHeight;
            activityStepList.push(step);
            scrollBottom();
        }

        function doneActivity() {
            activitySpinner.classList.add('done');
            activityStepList.forEach(s => s.classList.remove('latest'));
            setTimeout(() => {
                if (!activityOpen) {
                    activityWrap.style.display = 'none';
                    activitySteps.innerHTML = '';
                    activityStepList = [];
                }
            }, 1800);
        }

        function resetActivity() {
            activityWrap.style.display = 'none';
            activitySteps.innerHTML = '';
            activityStepList = [];
            activityOpen = false;
            activityToggle.classList.remove('open');
            activitySteps.classList.remove('visible');
        }

        // ── Auth flow ─────────────────────────────────────────

        async function checkAuth() {
            try {
                const headers = {};
                if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
                const resp = await fetch('/api/auth/status', { headers });
                const data = await resp.json();

                if (data.authenticated && authToken) { enterChat(); return; }

                if (authToken) {
                    authToken = null;
                    localStorage.removeItem('ownclaw_token');
                }

                authLoading.style.display = 'none';
                authBox.style.display = 'block';

                if (data.hasUsers) switchToLogin();
                else switchToRegister();
            } catch (e) {
                authLoading.textContent = 'Cannot reach server. Retrying...';
                setTimeout(checkAuth, 3000);
            }
        }

        function switchToRegister() {
            isRegisterMode = true;
            authTitle.textContent = 'Welcome to OwnClaw';
            authSubtitle.textContent = 'Create your account to get started';
            authSubmit.textContent = 'Create Account';
            authPassword.placeholder = 'Password (min 4 characters)';
            authPassword.autocomplete = 'new-password';
            authToggle.style.display = 'none';
            authError.style.display = 'none';
        }

        function switchToLogin() {
            isRegisterMode = false;
            authTitle.textContent = 'Sign In';
            authSubtitle.textContent = 'Enter your credentials to continue';
            authSubmit.textContent = 'Sign In';
            authPassword.placeholder = 'Password';
            authPassword.autocomplete = 'current-password';
            authToggle.style.display = 'block';
            authToggle.textContent = 'Need an account? Register';
            authError.style.display = 'none';
        }

        authToggle.addEventListener('click', () => {
            if (isRegisterMode) switchToLogin(); else switchToRegister();
        });

        async function doAuth() {
            const username = authUsername.value.trim();
            const password = authPassword.value;

            if (!username || password.length < 4) {
                showAuthError('Username required, password must be at least 4 characters');
                return;
            }

            authSubmit.disabled = true;
            authError.style.display = 'none';

            const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showAuthError(data.error || 'Authentication failed');
                    authSubmit.disabled = false;
                    return;
                }
                authToken = data.token;
                localStorage.setItem('ownclaw_token', authToken);
                enterChat();
            } catch (e) {
                showAuthError('Network error — try again');
                authSubmit.disabled = false;
            }
        }

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.style.display = 'block';
        }

        function enterChat() {
            authOverlay.classList.add('hidden');
            connect();
        }

        function logout() {
            authToken = null;
            localStorage.removeItem('ownclaw_token');
            if (ws) { ws.close(); ws = null; }
            reconnectAttempt = 0;
            messagesEl.querySelectorAll('.msg').forEach(m => m.remove());
            connDot.classList.remove('online');
            hideConnBanner();
            resetActivity();
            authOverlay.classList.remove('hidden');
            authLoading.style.display = 'none';
            authBox.style.display = 'block';
            authUsername.value = '';
            authPassword.value = '';
            authSubmit.disabled = false;
            switchToLogin();
        }

        authSubmit.addEventListener('click', doAuth);
        authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
        authUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') authPassword.focus(); });
        logoutBtn.addEventListener('click', logout);

        // ── WebSocket ─────────────────────────────────────────

        let heartbeatTimer = null;

        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(() => {
                try {
                    if (ws && ws.readyState === WebSocket.OPEN)
                        ws.send(JSON.stringify({ type: 'ping' }));
                } catch { /* ignore */ }
            }, 25000);
        }

        function stopHeartbeat() {
            if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
        }

        function showConnBanner(text) {
            connText.textContent = text;
            connBanner.classList.add('visible');
            scrollBottom();
        }

        function hideConnBanner() {
            connBanner.classList.remove('visible');
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const tokenParam = authToken ? '?token=' + encodeURIComponent(authToken) : '';
            ws = new WebSocket(proto + '//' + location.host + '/ws/chat' + tokenParam);

            ws.onopen = () => {
                connDot.classList.add('online');
                hideConnBanner();
                startHeartbeat();
                reconnectAttempt = 0;
            };

            ws.onclose = (e) => {
                connDot.classList.remove('online');
                setThinking(false);
                stopHeartbeat();
                if (e.code === 1008) { logout(); return; }
                reconnectAttempt++;
                const delay = Math.min(3000 * reconnectAttempt, 30000);
                showConnBanner(reconnectAttempt === 1
                    ? 'Disconnected — reconnecting...'
                    : 'Reconnecting… attempt ' + reconnectAttempt);
                setTimeout(connect, delay);
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    const type = data.type || 'response';
                    const content = data.content || '';

                    if (type === 'status') {
                        setThinking(true, content);
                        showActivity(content);
                    } else if (type === 'pong' || type === 'ping') {
                        // heartbeat — no-op
                    } else {
                        if (type === 'response') { setThinking(false); doneActivity(); }
                        addMsg(type, content);
                    }
                } catch {
                    setThinking(false);
                    doneActivity();
                    addMsg('response', e.data);
                }
            };
        }

        function setThinking(on, text) {
            if (on) {
                thinkingEl.classList.add('active');
                if (text) thinkingText.textContent = text;
                scrollBottom();
            } else {
                thinkingEl.classList.remove('active');
                thinkingText.textContent = 'Thinking...';
                busy = false;
            }
        }

        function addMsg(type, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;

            if (type === 'user') {
                // User messages: plain text, preserve newlines
                div.textContent = text;
            } else {
                // All non-user messages: render markdown
                div.innerHTML = renderMarkdown(text);
                div.classList.add('md');
                div.querySelectorAll('pre').forEach(wrapCodeBlock);
            }

            messagesEl.insertBefore(div, thinkingEl);
            scrollBottom();
        }

        function renderMarkdown(text) {
            try { return marked.parse(text); }
            catch { return '<p>' + escapeHtml(text) + '</p>'; }
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function wrapCodeBlock(pre) {
            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrap';
            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(pre);
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.onclick = () => {
                const code = pre.querySelector('code');
                navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(() => {
                    btn.textContent = 'Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
                });
            };
            wrapper.appendChild(btn);
        }

        function send() {
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== 1) return;
            addMsg('user', text);
            ws.send(JSON.stringify({ message: text }));
            inputEl.value = '';
            inputEl.style.height = 'auto';
            busy = true;
            resetActivity();
            setThinking(true, 'Processing…');
        }

        function scrollBottom() {
            requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
        }

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        sendBtn.addEventListener('click', send);

        checkAuth();
    })();
    </script>
</body>
</html>
