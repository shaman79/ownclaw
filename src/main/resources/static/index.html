<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnClaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"><\/script>
    <style>
        /*  Design tokens  */
        :root {
            --bg:          #0d0f14;
            --bg-elevated: #13161f;
            --bg-input:    #1a1d27;
            --surface:     #1c2030;
            --border:      rgba(255,255,255,.07);
            --border-mid:  rgba(255,255,255,.1);
            --accent:      #5b5fc7;
            --accent-hi:   #818cf8;
            --accent-glow: rgba(91,95,199,.22);
            --user-bg:     #3730a3;
            --user-hi:     #4338ca;
            --text-1:      #f0f1f5;
            --text-2:      #9ca3af;
            --text-3:      #5c6479;
            --red:         #f87171;
            --red-dim:     rgba(248,113,113,.12);
            --green:       #34d399;
            --green-dim:   rgba(52,211,153,.15);
            --r-sm:        10px;
            --r-md:        14px;
            --r-lg:        20px;
            --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
            --shadow-md:   0 4px 20px rgba(0,0,0,.5);
            --shadow-lg:   0 12px 48px rgba(0,0,0,.7);
            --font:        -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
            --font-mono:   "Cascadia Code","Fira Code","JetBrains Mono","SF Mono", monospace;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-1);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /*  Auth overlay  */
        #auth-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #auth-overlay.hidden { display: none }

        .auth-loading {
            color: var(--text-3);
            font-size: 14px;
            letter-spacing: .01em;
        }

        #auth-box {
            width: 360px;
            max-width: 92vw;
            background: var(--bg-elevated);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .auth-logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .auth-logo-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        #auth-box h2 {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -.2px;
        }
        #auth-box .subtitle {
            color: var(--text-2);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .auth-field input {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: var(--bg-input);
            color: var(--text-1);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .auth-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-field input::placeholder { color: var(--text-3) }

        #auth-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: opacity .15s, transform .1s, box-shadow .15s;
            box-shadow: 0 4px 16px var(--accent-glow);
            letter-spacing: .01em;
        }
        #auth-submit:hover { opacity: .88; transform: translateY(-1px) }
        #auth-submit:active { transform: translateY(0); opacity: 1 }
        #auth-submit:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #auth-error {
            color: var(--red);
            font-size: 12.5px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            background: var(--red-dim);
            border-radius: 8px;
        }
        #auth-toggle {
            color: var(--accent-hi);
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            cursor: pointer;
            transition: opacity .15s;
        }
        #auth-toggle:hover { opacity: .75 }

        /*  Header  */
        #header {
            height: 52px;
            flex-shrink: 0;
            padding: 0 20px;
            background: rgba(13,15,20,.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px) saturate(1.4);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.25px;
        }
        #header-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        #conn-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            font-size: 11.5px;
            color: var(--text-3);
            transition: all .3s;
        }
        #conn-pill.online {
            color: var(--green);
            border-color: rgba(52,211,153,.25);
            background: var(--green-dim);
        }
        .conn-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        #conn-pill.online .conn-dot {
            box-shadow: 0 0 6px var(--green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1 }
            50% { opacity: .5 }
        }

        .header-spacer { flex: 1 }

        #logout-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: none;
            color: var(--text-3);
            font-size: 12px;
            font-family: var(--font);
            cursor: pointer;
            transition: all .15s;
        }
        #logout-btn:hover {
            color: var(--red);
            border-color: rgba(248,113,113,.3);
            background: var(--red-dim);
        }
        #logout-btn svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0 }

        /*  Messages scroll area  */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px 16px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 4px }
        #messages::-webkit-scrollbar-track { background: transparent }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px }
        #messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.14) }

        /* Column constraint */
        .msg, .activity-wrap, #conn-banner, #thinking {
            max-width: 780px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /*  Message animations  */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) }
            to   { opacity: 1; transform: none }
        }

        /*  Base message  */
        .msg {
            animation: msgIn .22s cubic-bezier(.16,1,.3,1) both;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* Group spacing */
        .msg.first-in-run { margin-top: 28px }
        .msg:first-child { margin-top: 0 }

        /*  User message  */
        .msg.user {
            align-self: flex-end;
            margin-left: auto;
            margin-right: 0;
            margin-bottom: 4px;
            max-width: 72%;
            background: linear-gradient(150deg, var(--user-hi), var(--user-bg) 90%);
            color: #fff;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            box-shadow: 0 2px 14px rgba(55,48,163,.3);
        }

        /*  AI / system message row  */
        .msg.response,
        .msg.error,
        .msg.question,
        .msg.input_request {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--user-bg) 0%, var(--accent) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 2px 8px var(--accent-glow);
            user-select: none;
        }
        .msg:not(.first-in-run) .msg-avatar { visibility: hidden }

        .msg-body {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-1);
        }

        /* Error variant */
        .msg.error .msg-avatar {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
        }
        .msg.error .msg-body {
            background: var(--red-dim);
            border: 1px solid rgba(248,113,113,.15);
            border-left: 3px solid var(--red);
            border-radius: 4px 12px 12px 12px;
            padding: 10px 14px;
            color: #fca5a5;
        }

        /* Question / input_request variant */
        .msg.question .msg-avatar,
        .msg.input_request .msg-avatar {
            background: linear-gradient(135deg, #1e1b4b, var(--accent));
        }
        .msg.question .msg-body,
        .msg.input_request .msg-body {
            background: rgba(91,95,199,.08);
            border: 1px solid rgba(91,95,199,.25);
            border-left: 3px solid var(--accent-hi);
            border-radius: 4px 12px 12px 12px;
            padding: 12px 16px;
        }

        /* System messages (centered pill) */
        .msg.system {
            align-self: center;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-3);
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            margin: 12px auto;
            max-width: 480px;
        }

        /*  Connection banner  */
        #conn-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            margin: 0 auto 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--text-3);
            font-size: 13px;
        }
        #conn-banner.visible { display: flex }
        #conn-banner .spinner {
            width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg) } }

        /*  Activity log  */
        .activity-wrap {
            margin-bottom: 8px;
            animation: msgIn .2s ease both;
        }
        #activity {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            overflow: hidden;
        }
        #activity-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            transition: background .12s;
        }
        #activity-header:hover { background: rgba(255,255,255,.03) }

        .activity-spinner {
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        .activity-spinner.done {
            border: 2px solid var(--green);
            animation: none;
        }

        #activity-label {
            flex: 1;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 500;
        }
        .activity-toggle {
            font-size: 10px;
            color: var(--text-3);
            transition: transform .2s;
            line-height: 1;
        }
        .activity-toggle.open { transform: rotate(180deg) }

        #activity-steps {
            display: none;
            border-top: 1px solid var(--border);
            padding: 6px 0 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        #activity-steps.visible { display: block }
        #activity-steps::-webkit-scrollbar { width: 3px }
        #activity-steps::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 3px }

        .activity-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 14px;
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.5;
        }
        .step-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--border-mid);
            flex-shrink: 0;
            margin-top: 5px;
        }
        .activity-step.latest { color: var(--text-2) }
        .activity-step.latest .step-dot { background: var(--accent-hi) }

        /*  Thinking indicator  */
        #thinking {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }
        #thinking.active { display: flex }

        .thinking-avatar {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            opacity: .6;
        }
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .thinking-dots span {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent-hi);
            opacity: .4;
            animation: blink 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: 0s }
        .thinking-dots span:nth-child(2) { animation-delay: .2s }
        .thinking-dots span:nth-child(3) { animation-delay: .4s }
        @keyframes blink {
            0%, 80%, 100% { opacity: .2; transform: scale(.8) }
            40%            { opacity: 1;  transform: scale(1.1) }
        }

        /*  Markdown  */
        .md p { margin: 0 0 10px }
        .md p:last-child { margin-bottom: 0 }
        .md ul, .md ol { margin: 4px 0 10px 22px }
        .md li { margin: 3px 0; line-height: 1.65 }
        .md strong { color: #fff; font-weight: 600 }
        .md em { color: #c9d1e2 }
        .md a { color: var(--accent-hi); text-decoration: none }
        .md a:hover { text-decoration: underline; color: #a5b4fc }
        .md blockquote {
            border-left: 3px solid rgba(255,255,255,.12);
            padding: 2px 14px;
            margin: 10px 0;
            color: var(--text-2);
        }
        .md h1,.md h2,.md h3 { margin: 18px 0 8px; font-weight: 600; color: #fff }
        .md h1 { font-size: 1.3em; border-bottom: 1px solid var(--border); padding-bottom: 8px }
        .md h2 { font-size: 1.15em }
        .md h3 { font-size: 1.05em }
        .md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0 }
        .md table { border-collapse: collapse; margin: 10px 0; width: 100%; display: block; overflow-x: auto }
        .md th, .md td { border: 1px solid rgba(255,255,255,.08); padding: 7px 12px; text-align: left; font-size: 13.5px }
        .md th { background: rgba(255,255,255,.04); font-weight: 600; color: #fff }
        .md tr:nth-child(even) td { background: rgba(255,255,255,.02) }
        .md img { max-width: 100%; height: auto; border-radius: 10px; margin: 8px 0 }
        .md code {
            background: rgba(255,255,255,.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 13px;
            font-family: var(--font-mono);
            color: #c4b5fd;
        }
        .md pre {
            background: #0a0c12;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
        }
        .md pre code {
            background: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-1);
            font-family: var(--font-mono);
        }
        .code-block-wrap { position: relative }
        .copy-btn {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            color: var(--text-3);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: var(--font);
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s, color .15s, background .15s;
        }
        .code-block-wrap:hover .copy-btn { opacity: 1 }
        .copy-btn:hover { background: rgba(255,255,255,.12); color: var(--text-1) }
        .copy-btn.copied { color: var(--green); opacity: 1 }

        /*  Input area  */
        #input-area {
            flex-shrink: 0;
            padding: 12px 20px 20px;
            background: rgba(13,15,20,.9);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .input-wrap {
            max-width: 780px;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            display: flex;
            align-items: flex-end;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-wrap:focus-within {
            border-color: rgba(91,95,199,.5);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #input {
            flex: 1;
            padding: 13px 16px;
            background: none;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-1);
            font-size: 15px;
            font-family: var(--font);
            line-height: 1.55;
            max-height: 160px;
            min-height: 50px;
        }
        #input::placeholder { color: var(--text-3) }

        #send {
            width: 38px; height: 38px;
            margin: 6px 8px 6px 0;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--user-hi), var(--accent));
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .15s, transform .1s, box-shadow .15s;
            box-shadow: 0 3px 12px var(--accent-glow);
        }
        #send:hover { opacity: .85; transform: scale(1.04) }
        #send:active { transform: scale(.96) }
        #send:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #send svg { width: 17px; height: 17px; fill: currentColor }

        .input-hint {
            max-width: 780px;
            margin: 7px auto 0;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-3);
            letter-spacing: .01em;
        }

        /*  Responsive  */
        @media (max-width: 600px) {
            #messages { padding: 20px 14px 12px }
            #input-area { padding: 10px 12px 16px }
            .msg.user { max-width: 85% }
            #header { padding: 0 14px }
        }
    </style>
</head>
<body>

<!--  Auth overlay  -->
<div id="auth-overlay">
    <div class="auth-loading" id="auth-loading">Checking session...</div>
    <div id="auth-box" style="display:none">
        <div class="auth-logo">
            <div class="auth-logo-icon">&#x1F980;</div>
            <span class="auth-logo-name">OwnClaw</span>
        </div>
        <h2 id="auth-title">Welcome back</h2>
        <div class="subtitle" id="auth-subtitle">Sign in to continue</div>
        <div class="auth-field">
            <input type="text"     id="auth-username" placeholder="Username"  autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password"  autocomplete="current-password">
        </div>
        <button id="auth-submit">Sign In</button>
        <div id="auth-error"></div>
        <div id="auth-toggle" style="display:none"></div>
    </div>
</div>

<!--  Header  -->
<header id="header">
    <div id="header-brand">
        <div id="header-icon">&#x1F980;</div>
        OwnClaw
    </div>
    <div id="conn-pill">
        <span class="conn-dot"></span>
        <span id="conn-label">Connecting</span>
    </div>
    <span class="header-spacer"></span>
    <button id="logout-btn">
        <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-9c-1.1 0-2 .9-2 2v4h2V5h9v14h-9v-4H9v4c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        Sign out
    </button>
</header>

<!--  Messages  -->
<div id="messages">
    <div id="conn-banner"><div class="spinner"></div><span id="conn-text"></span></div>

    <div class="activity-wrap" id="activity-wrap" style="display:none">
        <div id="activity">
            <div id="activity-header">
                <div class="activity-spinner" id="activity-spinner"></div>
                <span id="activity-label">Working...</span>
                <span class="activity-toggle" id="activity-toggle">&#x25be;</span>
            </div>
            <div id="activity-steps"></div>
        </div>
    </div>

    <div id="thinking">
        <div class="thinking-avatar">&#x1F980;</div>
        <div class="thinking-dots"><span></span><span></span><span></span></div>
    </div>
</div>

<!--  Input bar  -->
<div id="input-area">
    <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Message OwnClaw..." autocomplete="off"></textarea>
        <button id="send" title="Send (Enter)">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter for new line</div>
</div>

<script>
(function() {
    var authOverlay  = document.getElementById('auth-overlay');
    var authLoading  = document.getElementById('auth-loading');
    var authBox      = document.getElementById('auth-box');
    var authTitle    = document.getElementById('auth-title');
    var authSubtitle = document.getElementById('auth-subtitle');
    var authUsername = document.getElementById('auth-username');
    var authPassword = document.getElementById('auth-password');
    var authSubmit   = document.getElementById('auth-submit');
    var authError    = document.getElementById('auth-error');
    var authToggle   = document.getElementById('auth-toggle');
    var logoutBtn    = document.getElementById('logout-btn');

    var messagesEl      = document.getElementById('messages');
    var thinkingEl      = document.getElementById('thinking');
    var inputEl         = document.getElementById('input');
    var sendBtn         = document.getElementById('send');
    var connPill        = document.getElementById('conn-pill');
    var connLabel       = document.getElementById('conn-label');
    var connBanner      = document.getElementById('conn-banner');
    var connText        = document.getElementById('conn-text');

    var activityWrap    = document.getElementById('activity-wrap');
    var activitySpinner = document.getElementById('activity-spinner');
    var activityLabel   = document.getElementById('activity-label');
    var activityStepsEl = document.getElementById('activity-steps');
    var activityToggle  = document.getElementById('activity-toggle');
    var activityHeader  = document.getElementById('activity-header');

    var reconnectAttempt = 0;
    var authToken  = localStorage.getItem('ownclaw_token');
    var isRegisterMode = true;
    var activityStepList = [];
    var activityOpen = false;
    var ws;
    var busy = false;
    var lastMsgSender = null;
    var heartbeatTimer = null;

    marked.setOptions({ breaks: true, gfm: true });

    //  Activity log 
    activityHeader.addEventListener('click', function() {
        activityOpen = !activityOpen;
        activityStepsEl.classList.toggle('visible', activityOpen);
        activityToggle.classList.toggle('open', activityOpen);
    });

    function showActivity(text) {
        activityWrap.style.display = 'block';
        activitySpinner.classList.remove('done');
        activityLabel.textContent = text;
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        var step = document.createElement('div');
        step.className = 'activity-step latest';
        step.innerHTML = '<span class="step-dot"></span><span>' + escapeHtml(text) + '</span>';
        activityStepsEl.appendChild(step);
        activityStepsEl.scrollTop = activityStepsEl.scrollHeight;
        activityStepList.push(step);
        scrollBottom();
    }

    function doneActivity() {
        activitySpinner.classList.add('done');
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        setTimeout(function() {
            if (!activityOpen) {
                activityWrap.style.display = 'none';
                activityStepsEl.innerHTML = '';
                activityStepList = [];
            }
        }, 1800);
    }

    function resetActivity() {
        activityWrap.style.display = 'none';
        activityStepsEl.innerHTML = '';
        activityStepList = [];
        activityOpen = false;
        activityToggle.classList.remove('open');
        activityStepsEl.classList.remove('visible');
    }

    //  Auth flow 
    function checkAuth() {
        var headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        fetch('/api/auth/status', { headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.authenticated && authToken) { enterChat(); return; }
                if (authToken) { authToken = null; localStorage.removeItem('ownclaw_token'); }
                authLoading.style.display = 'none';
                authBox.style.display = 'block';
                if (data.hasUsers) switchToLogin(); else switchToRegister();
            })
            .catch(function() {
                authLoading.textContent = 'Cannot reach server - retrying...';
                setTimeout(checkAuth, 3000);
            });
    }

    function switchToRegister() {
        isRegisterMode = true;
        authTitle.textContent = 'Create your account';
        authSubtitle.textContent = 'Get started with OwnClaw';
        authSubmit.textContent = 'Create Account';
        authPassword.placeholder = 'Password (min 4 characters)';
        authPassword.autocomplete = 'new-password';
        authToggle.style.display = 'none';
        authError.style.display = 'none';
    }

    function switchToLogin() {
        isRegisterMode = false;
        authTitle.textContent = 'Welcome back';
        authSubtitle.textContent = 'Sign in to continue';
        authSubmit.textContent = 'Sign In';
        authPassword.placeholder = 'Password';
        authPassword.autocomplete = 'current-password';
        authToggle.style.display = 'block';
        authToggle.textContent = "Don't have an account? Register";
        authError.style.display = 'none';
    }

    authToggle.addEventListener('click', function() {
        if (isRegisterMode) switchToLogin(); else switchToRegister();
    });

    function doAuth() {
        var username = authUsername.value.trim();
        var password = authPassword.value;
        if (!username || password.length < 4) {
            showAuthError('Username required and password must be at least 4 characters');
            return;
        }
        authSubmit.disabled = true;
        authError.style.display = 'none';
        var endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(r) {
            return r.json().then(function(data) { return { ok: r.ok, data: data }; });
        })
        .then(function(res) {
            if (!res.ok) { showAuthError(res.data.error || 'Authentication failed'); authSubmit.disabled = false; return; }
            authToken = res.data.token;
            localStorage.setItem('ownclaw_token', authToken);
            enterChat();
        })
        .catch(function() {
            showAuthError('Network error - please try again');
            authSubmit.disabled = false;
        });
    }

    function showAuthError(msg) {
        authError.textContent = msg;
        authError.style.display = 'block';
    }

    function enterChat() {
        authOverlay.classList.add('hidden');
        connect();
    }

    function logout() {
        authToken = null;
        localStorage.removeItem('ownclaw_token');
        if (ws) { ws.close(); ws = null; }
        reconnectAttempt = 0;
        messagesEl.querySelectorAll('.msg').forEach(function(m) { m.remove(); });
        lastMsgSender = null;
        setConnState(false, 'Offline');
        hideConnBanner();
        resetActivity();
        authOverlay.classList.remove('hidden');
        authLoading.style.display = 'none';
        authBox.style.display = 'block';
        authUsername.value = '';
        authPassword.value = '';
        authSubmit.disabled = false;
        switchToLogin();
    }

    authSubmit.addEventListener('click', doAuth);
    authPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') doAuth(); });
    authUsername.addEventListener('keydown', function(e) { if (e.key === 'Enter') authPassword.focus(); });
    logoutBtn.addEventListener('click', logout);

    //  Connection state 
    function setConnState(online, label) {
        connPill.classList.toggle('online', online);
        connLabel.textContent = label || (online ? 'Connected' : 'Offline');
    }

    function showConnBanner(text) {
        connText.textContent = text;
        connBanner.classList.add('visible');
        scrollBottom();
    }
    function hideConnBanner() { connBanner.classList.remove('visible'); }

    //  WebSocket 
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(function() {
            try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' })); }
            catch(e) {}
        }, 25000);
    }
    function stopHeartbeat() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    function connect() {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var tokenParam = authToken ? '?token=' + encodeURIComponent(authToken) : '';
        ws = new WebSocket(proto + '//' + location.host + '/ws/chat' + tokenParam);

        ws.onopen = function() {
            setConnState(true, 'Connected');
            hideConnBanner();
            startHeartbeat();
            reconnectAttempt = 0;
        };

        ws.onclose = function(e) {
            setConnState(false, 'Disconnected');
            setThinking(false);
            stopHeartbeat();
            if (e.code === 1008) { logout(); return; }
            reconnectAttempt++;
            var delay = Math.min(3000 * reconnectAttempt, 30000);
            setConnState(false, 'Reconnecting...');
            showConnBanner(reconnectAttempt === 1 ? 'Disconnected - reconnecting...' : 'Reconnecting... attempt ' + reconnectAttempt);
            setTimeout(connect, delay);
        };

        ws.onmessage = function(e) {
            try {
                var data = JSON.parse(e.data);
                var type    = data.type    || 'response';
                var content = data.content || '';
                if (type === 'status') {
                    setThinking(true);
                    showActivity(content);
                } else if (type === 'pong' || type === 'ping') {
                    // heartbeat
                } else {
                    if (type === 'response') { setThinking(false); doneActivity(); }
                    addMsg(type, content);
                }
            } catch(ex) {
                setThinking(false);
                doneActivity();
                addMsg('response', e.data);
            }
        };
    }

    function setThinking(on) {
        if (on) {
            thinkingEl.classList.add('active');
            scrollBottom();
        } else {
            thinkingEl.classList.remove('active');
            busy = false;
        }
    }

    //  Message rendering 
    function addMsg(type, text) {
        var isUserMsg = type === 'user';
        var isAiMsg   = (type === 'response' || type === 'error' || type === 'question' || type === 'input_request');
        var senderKey = isUserMsg ? 'user' : (isAiMsg ? 'ai' : null);
        var firstInRun = senderKey !== null && senderKey !== lastMsgSender;
        if (senderKey) lastMsgSender = senderKey;

        var div = document.createElement('div');
        div.className = 'msg ' + type + (firstInRun ? ' first-in-run' : '');

        if (isUserMsg) {
            div.textContent = text;
        } else if (isAiMsg) {
            var avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = String.fromCodePoint(0x1F980);

            var body = document.createElement('div');
            body.className = 'msg-body md';
            body.innerHTML = renderMarkdown(text);
            body.querySelectorAll('pre').forEach(wrapCodeBlock);

            div.appendChild(avatar);
            div.appendChild(body);
        } else {
            div.innerHTML = renderMarkdown(text);
            div.classList.add('md');
            div.querySelectorAll('pre').forEach(wrapCodeBlock);
        }

        messagesEl.insertBefore(div, thinkingEl);
        scrollBottom();
    }

    function renderMarkdown(text) {
        try { return marked.parse(text); }
        catch(e) { return '<p>' + escapeHtml(text) + '</p>'; }
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function wrapCodeBlock(pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrap';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = function() {
            var code = pre.querySelector('code');
            navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(function() {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        };
        wrapper.appendChild(btn);
    }

    //  Send 
    function send() {
        var text = inputEl.value.trim();
        if (!text || !ws || ws.readyState !== 1) return;
        addMsg('user', text);
        ws.send(JSON.stringify({ message: text }));
        inputEl.value = '';
        inputEl.style.height = 'auto';
        busy = true;
        resetActivity();
        setThinking(true);
    }

    function scrollBottom() {
        requestAnimationFrame(function() { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }

    inputEl.addEventListener('input', function() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    sendBtn.addEventListener('click', send);

    checkAuth();
})();
</script>
</body>
</html>
