<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnClaw</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <style>
        /*  Design tokens  */
        :root {
            --bg:          #0d0f14;
            --bg-elevated: #13161f;
            --bg-input:    #1a1d27;
            --surface:     #1c2030;
            --border:      rgba(255,255,255,.07);
            --border-mid:  rgba(255,255,255,.1);
            --accent:      #5b5fc7;
            --accent-hi:   #818cf8;
            --accent-glow: rgba(91,95,199,.22);
            --user-bg:     #3730a3;
            --user-hi:     #4338ca;
            --text-1:      #f0f1f5;
            --text-2:      #9ca3af;
            --text-3:      #5c6479;
            --red:         #f87171;
            --red-dim:     rgba(248,113,113,.12);
            --green:       #34d399;
            --green-dim:   rgba(52,211,153,.15);
            --r-sm:        8px;
            --r-md:        12px;
            --r-lg:        16px;
            --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
            --shadow-md:   0 4px 20px rgba(0,0,0,.5);
            --shadow-lg:   0 12px 48px rgba(0,0,0,.7);
            --font:        -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
            --font-mono:   "Cascadia Code","Fira Code","JetBrains Mono","SF Mono", monospace;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-1);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /*  Auth overlay  */
        #auth-overlay {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #auth-overlay.hidden { display: none }

        .auth-loading {
            color: var(--text-3);
            font-size: 14px;
            letter-spacing: .01em;
        }

        #auth-box {
            width: 360px;
            max-width: 92vw;
            background: var(--bg-elevated);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .auth-logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .auth-logo-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        #auth-box h2 {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -.2px;
        }
        #auth-box .subtitle {
            color: var(--text-2);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .auth-field input {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: var(--bg-input);
            color: var(--text-1);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .auth-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-field input::placeholder { color: var(--text-3) }

        #auth-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: opacity .15s, transform .1s, box-shadow .15s;
            box-shadow: 0 4px 16px var(--accent-glow);
            letter-spacing: .01em;
        }
        #auth-submit:hover { opacity: .88; transform: translateY(-1px) }
        #auth-submit:active { transform: translateY(0); opacity: 1 }
        #auth-submit:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #auth-error {
            color: var(--red);
            font-size: 12.5px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 8px 12px;
            background: var(--red-dim);
            border-radius: 8px;
        }
        #auth-toggle {
            color: var(--accent-hi);
            font-size: 13px;
            text-align: center;
            margin-top: 18px;
            cursor: pointer;
            transition: opacity .15s;
        }
        #auth-toggle:hover { opacity: .75 }

        /*  Header  */
        #header {
            height: 52px;
            flex-shrink: 0;
            padding: 0 20px;
            background: rgba(13,15,20,.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px) saturate(1.4);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.25px;
        }
        #header-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        #conn-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            font-size: 11.5px;
            color: var(--text-3);
            transition: all .3s;
        }
        #conn-pill.online {
            color: var(--green);
            border-color: rgba(52,211,153,.25);
            background: var(--green-dim);
        }
        .conn-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        #conn-pill.online .conn-dot {
            box-shadow: 0 0 6px var(--green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1 }
            50% { opacity: .5 }
        }

        .header-spacer { flex: 1 }

        #logout-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            background: none;
            color: var(--text-3);
            font-size: 12px;
            font-family: var(--font);
            cursor: pointer;
            transition: all .15s;
        }
        #logout-btn:hover {
            color: var(--red);
            border-color: rgba(248,113,113,.3);
            background: var(--red-dim);
        }
        #logout-btn svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0 }

        /*  Messages scroll area  */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 5px }
        #messages::-webkit-scrollbar-track { background: transparent }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px }
        #messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.14) }

        /* Column constraint */
        .msg, #conn-banner, #thinking {
            max-width: 780px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /*  Message animations  */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) }
            to   { opacity: 1; transform: none }
        }

        /*  Base message  */
        .msg {
            animation: msgIn .2s cubic-bezier(.16,1,.3,1) both;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* Group spacing — extra gap before a new sender */
        .msg.first-in-run { margin-top: 20px }
        .msg:first-child  { margin-top: 0 }

        /* ───── User message ───── */
        .msg.user {
            display: flex;
            justify-content: flex-end;
            padding: 2px 0;
        }
        .msg.user .bubble {
            max-width: 72%;
            background: var(--user-hi);
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--r-md) var(--r-md) 4px var(--r-md);
            font-size: 14.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow: 0 1px 8px rgba(55,48,163,.25);
        }
        /* Consecutive user messages: flatten top-right corner */
        .msg.user:not(.first-in-run) .bubble {
            border-radius: var(--r-md) 6px 4px var(--r-md);
        }

        /* ───── AI / assistant message ───── */
        .msg.response,
        .msg.error,
        .msg.question,
        .msg.input_request,
        .msg.debug {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 2px 0;
        }

        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: var(--r-sm);
            background: linear-gradient(135deg, var(--user-bg) 0%, var(--accent) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 4px;
            box-shadow: 0 2px 8px var(--accent-glow);
            user-select: none;
        }
        .msg:not(.first-in-run) .msg-avatar { visibility: hidden }

        .msg-body {
            flex: 1;
            min-width: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px var(--r-md) var(--r-md) var(--r-md);
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--text-1);
        }
        /* Consecutive AI messages: soften top-left corner */
        .msg:not(.first-in-run) .msg-body {
            border-radius: 6px var(--r-md) var(--r-md) var(--r-md);
        }

        /* Error variant */
        .msg.error .msg-avatar {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
        }
        .msg.error .msg-body {
            background: var(--red-dim);
            border: 1px solid rgba(248,113,113,.15);
            border-left: 3px solid var(--red);
            color: #fca5a5;
        }

        /* Question / input_request variant */
        .msg.question .msg-avatar,
        .msg.input_request .msg-avatar {
            background: linear-gradient(135deg, #1e1b4b, var(--accent));
        }
        .msg.question .msg-body,
        .msg.input_request .msg-body {
            background: rgba(91,95,199,.06);
            border: 1px solid rgba(91,95,199,.2);
            border-left: 3px solid var(--accent-hi);
        }

        /* Debug variant */
        .msg.debug .msg-avatar {
            background: linear-gradient(135deg, #422006, #92400e);
        }
        .msg.debug .msg-body {
            background: rgba(251,191,36,.04);
            border: 1px solid rgba(251,191,36,.15);
            border-left: 3px solid #fbbf24;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-2);
            max-height: 500px;
            overflow-y: auto;
        }
        .msg.debug .msg-body::-webkit-scrollbar { width: 4px }
        .msg.debug .msg-body::-webkit-scrollbar-thumb { background: rgba(251,191,36,.2); border-radius: 4px }

        /* ───── System messages ───── */
        /* Short: centred pill.  Long (contains newline or >80 chars): card. */
        .msg.system {
            align-self: center;
            text-align: left;
            font-size: 13px;
            color: var(--text-2);
            padding: 10px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            margin: 10px auto;
            max-width: 620px;
            line-height: 1.65;
        }
        /* Truly short system messages get the pill look */
        .msg.system.short {
            text-align: center;
            padding: 6px 16px;
            border-radius: 100px;
            max-width: 480px;
            font-size: 12.5px;
            color: var(--text-3);
        }

        /*  Connection banner  */
        #conn-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            margin: 0 auto 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--text-3);
            font-size: 13px;
        }
        #conn-banner.visible { display: flex }
        #conn-banner .spinner {
            width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg) } }

        /*  Activity log — pinned above the input bar, always visible  */
        .activity-wrap {
            flex-shrink: 0;
            background: rgba(13,15,20,.9);
            backdrop-filter: blur(12px);
            padding: 0 20px;
        }
        #activity {
            max-width: 780px;
            margin: 0 auto;
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }
        #activity-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            transition: background .12s;
        }
        #activity-header:hover { background: rgba(255,255,255,.03) }

        .activity-spinner {
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,.1);
            border-top-color: var(--accent-hi);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        .activity-spinner.done {
            border: 2px solid var(--green);
            animation: none;
        }

        #activity-label {
            flex: 1;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 500;
        }
        #activity-elapsed {
            font-size: 11px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
            min-width: 36px;
            text-align: right;
        }
        .activity-toggle {
            font-size: 10px;
            color: var(--text-3);
            transition: transform .2s;
            line-height: 1;
        }
        .activity-toggle.open { transform: rotate(180deg) }

        #activity-steps {
            display: none;
            border-top: 1px solid var(--border);
            padding: 6px 0 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        #activity-steps.visible { display: block }
        #activity-steps::-webkit-scrollbar { width: 3px }
        #activity-steps::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 3px }

        .activity-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 14px;
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.5;
        }
        .step-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--border-mid);
            flex-shrink: 0;
            margin-top: 5px;
        }
        .activity-step.latest { color: var(--text-2) }
        .activity-step.latest .step-dot { background: var(--accent-hi) }

        /*  Thinking indicator  */
        #thinking {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        #thinking.active { display: flex }

        .thinking-avatar {
            width: 30px; height: 30px;
            border-radius: var(--r-sm);
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            opacity: .55;
        }
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px var(--r-md) var(--r-md) var(--r-md);
        }
        .thinking-dots span {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-hi);
            opacity: .4;
            animation: blink 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: 0s }
        .thinking-dots span:nth-child(2) { animation-delay: .2s }
        .thinking-dots span:nth-child(3) { animation-delay: .4s }
        @keyframes blink {
            0%, 80%, 100% { opacity: .2; transform: scale(.8) }
            40%            { opacity: 1;  transform: scale(1.1) }
        }

        /*  Markdown inside message bodies  */
        .md p { margin: 0 0 8px }
        .md p:last-child { margin-bottom: 0 }
        .md ul, .md ol { margin: 4px 0 8px 20px }
        .md li { margin: 2px 0; line-height: 1.6 }
        .md li > p { margin-bottom: 2px }
        .md strong { color: #fff; font-weight: 600 }
        .md em { color: #c9d1e2 }
        .md a { color: var(--accent-hi); text-decoration: none }
        .md a:hover { text-decoration: underline; color: #a5b4fc }
        .md blockquote {
            border-left: 3px solid rgba(255,255,255,.12);
            padding: 2px 14px;
            margin: 8px 0;
            color: var(--text-2);
        }
        .md h1,.md h2,.md h3 { margin: 16px 0 6px; font-weight: 600; color: #fff }
        .md h1 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: 6px }
        .md h2 { font-size: 1.12em }
        .md h3 { font-size: 1.02em }
        .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0 }
        .md table { border-collapse: collapse; margin: 8px 0; width: 100%; display: block; overflow-x: auto }
        .md th, .md td { border: 1px solid rgba(255,255,255,.08); padding: 6px 12px; text-align: left; font-size: 13px }
        .md th { background: rgba(255,255,255,.04); font-weight: 600; color: #fff }
        .md tr:nth-child(even) td { background: rgba(255,255,255,.02) }
        .md img { max-width: 100%; height: auto; border-radius: var(--r-sm); margin: 8px 0 }
        .md code {
            background: rgba(255,255,255,.07);
            padding: 1.5px 5px;
            border-radius: 4px;
            font-size: 12.5px;
            font-family: var(--font-mono);
            color: #c4b5fd;
        }
        .md pre {
            background: #0a0c12;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 14px 16px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .md pre code {
            background: none;
            padding: 0;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-1);
            font-family: var(--font-mono);
        }
        .code-block-wrap { position: relative }
        .copy-btn {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            color: var(--text-3);
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-family: var(--font);
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s, color .15s, background .15s;
        }
        .code-block-wrap:hover .copy-btn { opacity: 1 }
        .copy-btn:hover { background: rgba(255,255,255,.12); color: var(--text-1) }
        .copy-btn.copied { color: var(--green); opacity: 1 }

        /*  Input area  */
        #input-area {
            flex-shrink: 0;
            padding: 10px 20px 18px;
            background: rgba(13,15,20,.92);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .input-wrap {
            max-width: 780px;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border-mid);
            border-radius: var(--r-lg);
            display: flex;
            align-items: flex-end;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-wrap:focus-within {
            border-color: rgba(91,95,199,.45);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #input {
            flex: 1;
            padding: 12px 16px;
            background: none;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-1);
            font-size: 14.5px;
            font-family: var(--font);
            line-height: 1.55;
            max-height: 160px;
            min-height: 48px;
        }
        #input::placeholder { color: var(--text-3) }

        #send {
            width: 36px; height: 36px;
            margin: 6px 8px 6px 0;
            flex-shrink: 0;
            background: var(--accent);
            border: none;
            border-radius: var(--r-sm);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .15s, transform .1s, background .15s;
        }
        #send:hover { background: var(--accent-hi); transform: scale(1.04) }
        #send:active { transform: scale(.96) }
        #send:disabled {
            background: var(--surface);
            color: var(--text-3);
            cursor: not-allowed;
            transform: none;
        }
        #send svg { width: 16px; height: 16px; fill: currentColor }

        #stop {
            width: 36px; height: 36px;
            margin: 6px 8px 6px 0;
            flex-shrink: 0;
            background: rgba(220, 60, 60, .85);
            border: none;
            border-radius: var(--r-sm);
            color: #fff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity .15s, transform .1s;
            box-shadow: 0 2px 8px rgba(220,60,60,.3);
        }
        #stop.visible { display: flex; }
        #stop:hover { opacity: .85; transform: scale(1.04) }
        #stop:active { transform: scale(.96) }
        #stop svg { width: 12px; height: 12px; fill: currentColor }

        .input-hint {
            max-width: 780px;
            margin: 6px auto 0;
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: .01em;
        }

        /*  Responsive  */
        @media (max-width: 600px) {
            #messages { padding: 16px 10px 12px }
            #input-area { padding: 8px 10px 14px }
            .msg.user .bubble { max-width: 88% }
            .msg-body { padding: 10px 12px }
            #header { padding: 0 12px }
            #sidebar { display: none }
            #sidebar.mobile-open { display: flex; position: fixed; inset: 0; z-index: 100; width: 100% }
            #sidebar-toggle { display: flex }
        }

        /*  Layout: sidebar + main  */
        #app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /*  Sidebar  */
        #sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
        }

        #sidebar-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        #new-chat-btn {
            flex: 1;
            padding: 9px 14px;
            background: linear-gradient(135deg, var(--user-bg), var(--accent));
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity .15s, transform .1s;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        #new-chat-btn:hover { opacity: .88; transform: translateY(-1px) }
        #new-chat-btn:active { transform: translateY(0) }
        #new-chat-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0 }

        #sidebar-close {
            display: none;
            width: 32px; height: 32px;
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-3);
            font-size: 16px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #sidebar-close { display: flex }
        }

        /*  Search  */
        #search-wrap {
            padding: 10px 14px 6px;
        }
        #search-input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-1);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        #search-input::placeholder { color: var(--text-3) }
        .search-icon-wrap {
            position: relative;
        }
        .search-icon-wrap svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 13px;
            fill: var(--text-3);
            pointer-events: none;
        }

        /*  Session list  */
        #session-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        #session-list::-webkit-scrollbar { width: 4px }
        #session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.06); border-radius: 3px }

        .session-item {
            padding: 10px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background .12s;
            margin-bottom: 2px;
            position: relative;
        }
        .session-item:hover { background: rgba(255,255,255,.04) }
        .session-item.active {
            background: rgba(91,95,199,.12);
            border: 1px solid rgba(91,95,199,.2);
        }
        .session-item:not(.active) { border: 1px solid transparent }

        .session-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 24px;
        }
        .session-preview {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-meta {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            gap: 2px;
        }
        .session-item:hover .session-actions { display: flex }
        .session-action-btn {
            width: 22px; height: 22px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-3);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .12s, border-color .12s;
        }
        .session-action-btn:hover { color: var(--text-1); border-color: var(--border-mid) }
        .session-action-btn.delete:hover { color: var(--red); border-color: rgba(248,113,113,.3) }

        /*  Search results overlay  */
        #search-results {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        #search-results.visible {
            display: block;
        }
        #search-results.visible ~ #session-list { display: none }

        .search-result-item {
            padding: 10px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background .12s;
            margin-bottom: 4px;
            border: 1px solid var(--border);
        }
        .search-result-item:hover { background: rgba(255,255,255,.04) }
        .search-result-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-1);
        }
        .search-result-snippet {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 4px;
            line-height: 1.5;
        }
        .search-result-snippet mark {
            background: rgba(91,95,199,.3);
            color: var(--text-1);
            border-radius: 2px;
            padding: 0 2px;
        }
        .search-empty {
            text-align: center;
            padding: 24px 16px;
            color: var(--text-3);
            font-size: 13px;
        }

        /*  Main chat column  */
        #chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /*  Sidebar toggle button (mobile)  */
        #sidebar-toggle {
            display: none;
            width: 32px; height: 32px;
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-2);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #sidebar-toggle svg { width: 16px; height: 16px; fill: currentColor }
        #sidebar-toggle:hover { color: var(--text-1); border-color: var(--border-mid) }
    </style>
</head>
<body>

<!--  Auth overlay  -->
<div id="auth-overlay">
    <div class="auth-loading" id="auth-loading">Checking session...</div>
    <div id="auth-box" style="display:none">
        <div class="auth-logo">
            <div class="auth-logo-icon">&#x1F980;</div>
            <span class="auth-logo-name">OwnClaw</span>
        </div>
        <h2 id="auth-title">Welcome back</h2>
        <div class="subtitle" id="auth-subtitle">Sign in to continue</div>
        <div class="auth-field">
            <input type="text"     id="auth-username" placeholder="Username"  autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password"  autocomplete="current-password">
        </div>
        <button id="auth-submit">Sign In</button>
        <div id="auth-error"></div>
        <div id="auth-toggle" style="display:none"></div>
    </div>
</div>

<!--  Header  -->
<header id="header">
    <button id="sidebar-toggle" title="Chat history">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <div id="header-brand">
        <div id="header-icon">&#x1F980;</div>
        OwnClaw
    </div>
    <div id="conn-pill">
        <span class="conn-dot"></span>
        <span id="conn-label">Connecting</span>
    </div>
    <span class="header-spacer"></span>
    <button id="logout-btn">
        <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-9c-1.1 0-2 .9-2 2v4h2V5h9v14h-9v-4H9v4c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        Sign out
    </button>
</header>

<!--  App layout: sidebar + chat  -->
<div id="app-layout">

    <!--  Sidebar: chat history  -->
    <aside id="sidebar">
        <div id="sidebar-header">
            <button id="new-chat-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                New Chat
            </button>
            <button id="sidebar-close">&times;</button>
        </div>
        <div id="search-wrap">
            <div class="search-icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-input" placeholder="Search chats..." autocomplete="off">
            </div>
        </div>
        <div id="search-results"></div>
        <div id="session-list"></div>
    </aside>

    <!--  Main chat column  -->
    <div id="chat-main">

<!--  Messages  -->
<div id="messages">
    <div id="conn-banner"><div class="spinner"></div><span id="conn-text"></span></div>

    <div id="thinking">
        <div class="thinking-avatar">&#x1F980;</div>
        <div class="thinking-dots"><span></span><span></span><span></span></div>
    </div>
</div>

<!--  Activity status — pinned above input, always visible during task execution  -->
<div class="activity-wrap" id="activity-wrap" style="display:none">
    <div id="activity">
        <div id="activity-header">
            <div class="activity-spinner" id="activity-spinner"></div>
            <span id="activity-label">Working...</span>
            <span id="activity-elapsed"></span>
            <span class="activity-toggle" id="activity-toggle">&#x25be;</span>
        </div>
        <div id="activity-steps"></div>
    </div>
</div>

<!--  Input bar  -->
<div id="input-area">
    <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Message OwnClaw..." autocomplete="off"></textarea>
        <button id="send" title="Send (Enter)">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
        <button id="stop" title="Stop task">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter for new line</div>
</div>

    </div><!-- end #chat-main -->
</div><!-- end #app-layout -->

<script>
(function() {
    var authOverlay  = document.getElementById('auth-overlay');
    var authLoading  = document.getElementById('auth-loading');
    var authBox      = document.getElementById('auth-box');
    var authTitle    = document.getElementById('auth-title');
    var authSubtitle = document.getElementById('auth-subtitle');
    var authUsername = document.getElementById('auth-username');
    var authPassword = document.getElementById('auth-password');
    var authSubmit   = document.getElementById('auth-submit');
    var authError    = document.getElementById('auth-error');
    var authToggle   = document.getElementById('auth-toggle');
    var logoutBtn    = document.getElementById('logout-btn');

    var messagesEl      = document.getElementById('messages');
    var thinkingEl      = document.getElementById('thinking');
    var inputEl         = document.getElementById('input');
    var sendBtn         = document.getElementById('send');
    var stopBtn         = document.getElementById('stop');
    var connPill        = document.getElementById('conn-pill');
    var connLabel       = document.getElementById('conn-label');
    var connBanner      = document.getElementById('conn-banner');
    var connText        = document.getElementById('conn-text');

    var activityWrap    = document.getElementById('activity-wrap');
    var activitySpinner = document.getElementById('activity-spinner');
    var activityLabel   = document.getElementById('activity-label');
    var activityElapsed = document.getElementById('activity-elapsed');
    var activityStepsEl = document.getElementById('activity-steps');
    var activityToggle  = document.getElementById('activity-toggle');
    var activityHeader  = document.getElementById('activity-header');

    // Sidebar elements
    var sidebar         = document.getElementById('sidebar');
    var sidebarToggle   = document.getElementById('sidebar-toggle');
    var sidebarClose    = document.getElementById('sidebar-close');
    var newChatBtn      = document.getElementById('new-chat-btn');
    var searchInput     = document.getElementById('search-input');
    var searchResults   = document.getElementById('search-results');
    var sessionListEl   = document.getElementById('session-list');

    var reconnectAttempt = 0;
    var authToken  = localStorage.getItem('ownclaw_token');
    var isRegisterMode = true;
    var activityStepList = [];
    var activityOpen = false;
    var ws;
    var busy = false;
    var lastMsgSender = null;
    var heartbeatTimer = null;
    var thinkingSafetyTimer = null;
    var activeSessionId = null;
    var thinkingStartedAt = null;
    var elapsedTimer = null;
    var searchDebounce = null;
    var needsInitialLoad = false;

    marked.setOptions({ breaks: true, gfm: true });

    //  Sidebar interactions
    sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('mobile-open');
    });
    sidebarClose.addEventListener('click', function() {
        sidebar.classList.remove('mobile-open');
    });

    newChatBtn.addEventListener('click', function() {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'new_session', message: '' }));
            clearMessages();
            sidebar.classList.remove('mobile-open');
        }
    });

    //  Search
    searchInput.addEventListener('input', function() {
        clearTimeout(searchDebounce);
        var q = searchInput.value.trim();
        if (!q) {
            searchResults.classList.remove('visible');
            searchResults.innerHTML = '';
            return;
        }
        searchDebounce = setTimeout(function() { doSearch(q); }, 300);
    });

    function doSearch(query) {
        if (!authToken) return;
        fetch('/api/chats/search?q=' + encodeURIComponent(query), {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            searchResults.innerHTML = '';
            var results = data.results || [];
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-empty">No results found</div>';
            } else {
                // Group by session
                var seen = {};
                results.forEach(function(r) {
                    if (seen[r.session_id]) return;
                    seen[r.session_id] = true;
                    var item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.innerHTML =
                        '<div class="search-result-title">' + escapeHtml(r.title || 'Untitled') + '</div>' +
                        '<div class="search-result-snippet">' + (r.snippet || '') + '</div>';
                    item.addEventListener('click', function() {
                        switchToSession(r.session_id);
                        searchInput.value = '';
                        searchResults.classList.remove('visible');
                        searchResults.innerHTML = '';
                        sidebar.classList.remove('mobile-open');
                    });
                    searchResults.appendChild(item);
                });
            }
            searchResults.classList.add('visible');
        })
        .catch(function(e) {
            console.error('Search failed:', e);
        });
    }

    //  Session management
    function switchToSession(sessionId) {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type: 'switch_session', message: sessionId }));
        clearMessages();
        // Load session messages via REST
        loadSessionMessages(sessionId);
    }

    function loadSessionMessages(sessionId) {
        if (!authToken) return;
        fetch('/api/chats/' + sessionId + '/messages', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            clearMessages();
            var msgs = data.messages || [];
            msgs.forEach(function(m) {
                var type = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'response');
                addMsg(type, m.content);
            });
        })
        .catch(function(e) { console.error('Failed to load messages:', e); });
    }

    function clearMessages() {
        messagesEl.querySelectorAll('.msg').forEach(function(m) { m.remove(); });
        lastMsgSender = null;
    }

    function renderSessionList(sessions, currentActiveId) {
        sessionListEl.innerHTML = '';
        activeSessionId = currentActiveId;
        if (!sessions || sessions.length === 0) {
            sessionListEl.innerHTML = '<div class="search-empty">No chats yet</div>';
            return;
        }
        sessions.forEach(function(s) {
            var item = document.createElement('div');
            item.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
            var timeStr = formatTime(s.updated_at);
            var msgCount = s.message_count || 0;
            item.innerHTML =
                '<div class="session-title">' + escapeHtml(s.title || 'Untitled') + '</div>' +
                (s.preview ? '<div class="session-preview">' + escapeHtml(s.preview) + '</div>' : '') +
                '<div class="session-meta"><span>' + timeStr + '</span><span>' + msgCount + ' msgs</span></div>' +
                '<div class="session-actions">' +
                    '<button class="session-action-btn rename" title="Rename">&#x270F;</button>' +
                    '<button class="session-action-btn delete" title="Delete">&#x2715;</button>' +
                '</div>';

            item.addEventListener('click', function(e) {
                if (e.target.closest('.session-action-btn')) return;
                if (s.id === activeSessionId) {
                    // Already active — just reload messages (in case chat was cleared)
                    loadSessionMessages(s.id);
                    sidebar.classList.remove('mobile-open');
                    return;
                }
                switchToSession(s.id);
                sidebar.classList.remove('mobile-open');
            });

            // Rename button
            item.querySelector('.rename').addEventListener('click', function(e) {
                e.stopPropagation();
                var newTitle = prompt('Rename chat:', s.title);
                if (newTitle && newTitle.trim()) {
                    renameSession(s.id, newTitle.trim());
                }
            });

            // Delete button
            item.querySelector('.delete').addEventListener('click', function(e) {
                e.stopPropagation();
                if (confirm('Delete this chat? This cannot be undone.')) {
                    deleteSession(s.id);
                }
            });

            sessionListEl.appendChild(item);
        });
    }

    function renameSession(sessionId, newTitle) {
        if (!authToken) return;
        fetch('/api/chats/' + sessionId, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle })
        })
        .then(function() { refreshSessionList(); })
        .catch(function(e) { console.error('Rename failed:', e); });
    }

    function deleteSession(sessionId) {
        if (!authToken) return;
        var wasActive = (sessionId === activeSessionId);
        fetch('/api/chats/' + sessionId, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(resp) {
            if (!resp.ok) throw new Error('Delete failed: ' + resp.status);
            return resp.json();
        })
        .then(function(data) {
            // Server returns updated session list + activeSessionId
            renderSessionList(data.sessions || [], data.activeSessionId || '');
            if (wasActive) {
                clearMessages();
                if (data.activeSessionId) {
                    loadSessionMessages(data.activeSessionId);
                }
            }
        })
        .catch(function(e) {
            console.error('Delete failed:', e);
            // Refresh sidebar from server to show accurate state
            refreshSessionList();
        });
    }

    function refreshSessionList() {
        if (!authToken) return Promise.resolve();
        return fetch('/api/chats', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderSessionList(data.sessions || [], data.activeSessionId);
        })
        .catch(function(e) { console.error('Failed to refresh sessions:', e); });
    }

    function formatTime(isoStr) {
        if (!isoStr) return '';
        try {
            var d = new Date(isoStr + 'Z');
            var now = new Date();
            var diff = now - d;
            if (diff < 60000) return 'just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
            return d.toLocaleDateString();
        } catch(e) { return isoStr; }
    }

    //  Activity log 
    activityHeader.addEventListener('click', function() {
        activityOpen = !activityOpen;
        activityStepsEl.classList.toggle('visible', activityOpen);
        activityToggle.classList.toggle('open', activityOpen);
    });

    function showActivity(text) {
        activityWrap.style.display = 'block';
        activitySpinner.classList.remove('done');
        activityLabel.textContent = text;
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        var step = document.createElement('div');
        step.className = 'activity-step latest';
        step.innerHTML = '<span class="step-dot"></span><span>' + escapeHtml(text) + '</span>';
        activityStepsEl.appendChild(step);
        activityStepsEl.scrollTop = activityStepsEl.scrollHeight;
        activityStepList.push(step);
        scrollBottom();
    }

    function doneActivity() {
        activitySpinner.classList.add('done');
        activityStepList.forEach(function(s) { s.classList.remove('latest'); });
        setTimeout(function() {
            if (!activityOpen) {
                activityWrap.style.display = 'none';
                activityStepsEl.innerHTML = '';
                activityStepList = [];
            }
        }, 5000);
    }

    function resetActivity() {
        activityWrap.style.display = 'none';
        activityStepsEl.innerHTML = '';
        activityStepList = [];
        activityOpen = false;
        activityToggle.classList.remove('open');
        activityStepsEl.classList.remove('visible');
    }

    //  Auth flow 
    function checkAuth() {
        var headers = {};
        if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
        fetch('/api/auth/status', { headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.authenticated && authToken) { enterChat(); return; }
                if (authToken) { authToken = null; localStorage.removeItem('ownclaw_token'); }
                authLoading.style.display = 'none';
                authBox.style.display = 'block';
                if (data.hasUsers) switchToLogin(); else switchToRegister();
            })
            .catch(function() {
                authLoading.textContent = 'Cannot reach server - retrying...';
                setTimeout(checkAuth, 3000);
            });
    }

    function switchToRegister() {
        isRegisterMode = true;
        authTitle.textContent = 'Create your account';
        authSubtitle.textContent = 'Get started with OwnClaw';
        authSubmit.textContent = 'Create Account';
        authPassword.placeholder = 'Password (min 4 characters)';
        authPassword.autocomplete = 'new-password';
        authToggle.style.display = 'none';
        authError.style.display = 'none';
    }

    function switchToLogin() {
        isRegisterMode = false;
        authTitle.textContent = 'Welcome back';
        authSubtitle.textContent = 'Sign in to continue';
        authSubmit.textContent = 'Sign In';
        authPassword.placeholder = 'Password';
        authPassword.autocomplete = 'current-password';
        authToggle.style.display = 'block';
        authToggle.textContent = "Don't have an account? Register";
        authError.style.display = 'none';
    }

    authToggle.addEventListener('click', function() {
        if (isRegisterMode) switchToLogin(); else switchToRegister();
    });

    function doAuth() {
        var username = authUsername.value.trim();
        var password = authPassword.value;
        if (!username || password.length < 4) {
            showAuthError('Username required and password must be at least 4 characters');
            return;
        }
        authSubmit.disabled = true;
        authError.style.display = 'none';
        var endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(r) {
            return r.json().then(function(data) { return { ok: r.ok, data: data }; });
        })
        .then(function(res) {
            if (!res.ok) { showAuthError(res.data.error || 'Authentication failed'); authSubmit.disabled = false; return; }
            authToken = res.data.token;
            localStorage.setItem('ownclaw_token', authToken);
            enterChat();
        })
        .catch(function() {
            showAuthError('Network error - please try again');
            authSubmit.disabled = false;
        });
    }

    function showAuthError(msg) {
        authError.textContent = msg;
        authError.style.display = 'block';
    }

    function enterChat() {
        authOverlay.classList.add('hidden');
        connect();
    }

    function logout() {
        authToken = null;
        localStorage.removeItem('ownclaw_token');
        if (ws) { ws.close(); ws = null; }
        reconnectAttempt = 0;
        messagesEl.querySelectorAll('.msg').forEach(function(m) { m.remove(); });
        lastMsgSender = null;
        activeSessionId = null;
        sessionListEl.innerHTML = '';
        searchResults.innerHTML = '';
        searchResults.classList.remove('visible');
        searchInput.value = '';
        setConnState(false, 'Offline');
        hideConnBanner();
        resetActivity();
        authOverlay.classList.remove('hidden');
        authLoading.style.display = 'none';
        authBox.style.display = 'block';
        authUsername.value = '';
        authPassword.value = '';
        authSubmit.disabled = false;
        switchToLogin();
    }

    authSubmit.addEventListener('click', doAuth);
    authPassword.addEventListener('keydown', function(e) { if (e.key === 'Enter') doAuth(); });
    authUsername.addEventListener('keydown', function(e) { if (e.key === 'Enter') authPassword.focus(); });
    logoutBtn.addEventListener('click', logout);

    //  Connection state 
    function setConnState(online, label) {
        connPill.classList.toggle('online', online);
        connLabel.textContent = label || (online ? 'Connected' : 'Offline');
    }

    function showConnBanner(text) {
        connText.textContent = text;
        connBanner.classList.add('visible');
        scrollBottom();
    }
    function hideConnBanner() { connBanner.classList.remove('visible'); }

    //  WebSocket 
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(function() {
            try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' })); }
            catch(e) {}
        }, 25000);
    }
    function stopHeartbeat() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    function connect() {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var tokenParam = authToken ? '?token=' + encodeURIComponent(authToken) : '';
        ws = new WebSocket(proto + '//' + location.host + '/ws/chat' + tokenParam);
        needsInitialLoad = true;

        ws.onopen = function() {
            setConnState(true, 'Connected');
            hideConnBanner();
            startHeartbeat();
            reconnectAttempt = 0;
        };

        ws.onclose = function(e) {
            setConnState(false, 'Disconnected');
            setThinking(false);
            stopHeartbeat();
            if (e.code === 1008) { logout(); return; }
            reconnectAttempt++;
            var delay = Math.min(3000 * reconnectAttempt, 30000);
            setConnState(false, 'Reconnecting...');
            showConnBanner(reconnectAttempt === 1 ? 'Disconnected - reconnecting...' : 'Reconnecting... attempt ' + reconnectAttempt);
            setTimeout(connect, delay);
        };

        ws.onmessage = function(e) {
            try {
                var data = JSON.parse(e.data);
                var type    = data.type    || 'response';
                var content = data.content || '';
                if (type === 'session_info') {
                    // Session list update from server
                    renderSessionList(data.sessions || [], data.activeSessionId || '');
                    // Only load messages on initial connect / reconnect, not on every
                    // switch/new_session (those handle message loading themselves).
                    if (needsInitialLoad && data.activeSessionId) {
                        loadSessionMessages(data.activeSessionId);
                        needsInitialLoad = false;
                    }
                } else if (type === 'session_updated') {
                    // A session was updated (new message, title change) — refresh sidebar
                    refreshSessionList();
                } else if (type === 'status') {
                    var sub = data.status || '';
                    if (sub === 'completed' || sub === 'failed' || sub === 'rollback') {
                        showActivity(content);
                        setThinking(false);
                        doneActivity();
                    } else {
                        setThinking(true);
                        resetThinkingSafetyTimer();
                        showActivity(content);
                    }
                } else if (type === 'debug') {
                    addMsg('debug', content);
                } else if (type === 'pong' || type === 'ping') {
                    // heartbeat
                } else {
                    if (type === 'response') { setThinking(false); doneActivity(); }
                    addMsg(type, content);
                }
            } catch(ex) {
                setThinking(false);
                doneActivity();
                addMsg('response', e.data);
            }
        };
    }

    function setThinking(on) {
        if (thinkingSafetyTimer) { clearTimeout(thinkingSafetyTimer); thinkingSafetyTimer = null; }
        if (on) {
            thinkingEl.classList.add('active');
            sendBtn.disabled = true;
            stopBtn.classList.add('visible');
            scrollBottom();
            // Start elapsed timer
            if (!thinkingStartedAt) {
                thinkingStartedAt = Date.now();
                startElapsedTimer();
            }
            // Safety net: auto-hide if no messages arrive for 15 minutes
            thinkingSafetyTimer = setTimeout(function() {
                setThinking(false);
                doneActivity();
            }, 900000);
        } else {
            thinkingEl.classList.remove('active');
            sendBtn.disabled = false;
            stopBtn.classList.remove('visible');
            busy = false;
            thinkingStartedAt = null;
            stopElapsedTimer();
        }
    }

    function resetThinkingSafetyTimer() {
        if (thinkingSafetyTimer) {
            clearTimeout(thinkingSafetyTimer);
            thinkingSafetyTimer = setTimeout(function() {
                setThinking(false);
                doneActivity();
            }, 900000);
        }
    }

    function startElapsedTimer() {
        stopElapsedTimer();
        updateElapsed();
        elapsedTimer = setInterval(updateElapsed, 1000);
    }

    function stopElapsedTimer() {
        if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
        activityElapsed.textContent = '';
    }

    function updateElapsed() {
        if (!thinkingStartedAt) return;
        var sec = Math.floor((Date.now() - thinkingStartedAt) / 1000);
        if (sec < 60) {
            activityElapsed.textContent = sec + 's';
        } else {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            activityElapsed.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }
    }

    //  Message rendering 
    function addMsg(type, text) {
        var isUserMsg = type === 'user';
        var isAiMsg   = (type === 'response' || type === 'error' || type === 'question' || type === 'input_request' || type === 'debug');
        var senderKey = isUserMsg ? 'user' : (isAiMsg ? 'ai' : null);
        var firstInRun = senderKey !== null && senderKey !== lastMsgSender;
        if (senderKey) lastMsgSender = senderKey;

        var div = document.createElement('div');
        div.className = 'msg ' + type + (firstInRun ? ' first-in-run' : '');

        if (isUserMsg) {
            var bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(bubble);
        } else if (isAiMsg) {
            var avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = String.fromCodePoint(0x1F980);

            var body = document.createElement('div');
            body.className = 'msg-body md';
            body.innerHTML = renderMarkdown(text);
            body.querySelectorAll('pre').forEach(wrapCodeBlock);

            div.appendChild(avatar);
            div.appendChild(body);
        } else {
            div.innerHTML = renderMarkdown(text);
            div.classList.add('md');
            div.querySelectorAll('pre').forEach(wrapCodeBlock);
            if (text.indexOf('\n') === -1 && text.length < 80) div.classList.add('short');
        }

        messagesEl.insertBefore(div, thinkingEl);
        scrollBottom();
    }

    function renderMarkdown(text) {
        try { return marked.parse(text); }
        catch(e) { return '<p>' + escapeHtml(text) + '</p>'; }
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function wrapCodeBlock(pre) {
        var wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrap';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = function() {
            var code = pre.querySelector('code');
            navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(function() {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        };
        wrapper.appendChild(btn);
    }

    //  Send 
    function send() {
        var text = inputEl.value.trim();
        if (!text || !ws || ws.readyState !== 1) return;
        addMsg('user', text);
        ws.send(JSON.stringify({ message: text }));
        inputEl.value = '';
        inputEl.style.height = 'auto';
        busy = true;
        resetActivity();
        setThinking(true);
    }

    function scrollBottom() {
        requestAnimationFrame(function() { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }

    inputEl.addEventListener('input', function() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    sendBtn.addEventListener('click', send);

    stopBtn.addEventListener('click', function() {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'cancel' }));
        }
        setThinking(false);
        doneActivity();
    });

    checkAuth();
})();
</script>
</body>
</html>
