spring:
  application:
    name: ownclaw

  datasource:
    # Pragmas belong in the URL, not in connection-init-sql.
    #
    # connection-init-sql is handed to a single Statement.execute(), and the SQLite driver runs
    # only the FIRST statement in it. Everything after the first semicolon was silently discarded
    # on every connection this application has ever opened. Production showed the signature
    # plainly: /api/ops/health reported journalMode=wal (the first pragma) next to foreignKeys=0
    # (the last), so foreign keys were never enforced despite being asked for.
    #
    # Measured against sqlite-jdbc 3.47.2 before changing this, because the obvious repair --
    # putting the pragmas on one line -- fails in exactly the same way:
    #   one execute() with all four  -> foreign_keys=0  synchronous=2     cache_size=-2000
    #   one execute() per pragma     -> foreign_keys=1  synchronous=1     cache_size=-8000
    #   as URL parameters            -> foreign_keys=1  synchronous=1     cache_size=-8000  wal
    # Only the URL form applies all of them, and it applies to every pooled connection.
    #
    # Enabling foreign keys changes behaviour on a database that has run for months without them,
    # so production was checked for violations first: every table carrying a reference -- and both
    # non-user references, active_session.session_id and message_attachments -- reported zero
    # orphans. Nothing writes a synthetic id into a referencing table either; skill.retired events
    # use user_id='system' and the events table has no foreign key.
    url: "jdbc:sqlite:${ownclaw.database.path:./data/ownclaw.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&cache_size=-8000&foreign_keys=true"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4  # WAL mode allows concurrent readers + 1 writer


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # 100 MB: the request body Cloudflare accepts in front of production -- a larger upload
      # never reaches this server, so nothing lower is set here. FileUploadController accepts
      # files up to the same size (its MAX_FILE_SIZE) and says so when it refuses one, but the
      # container parses the upload before the controller runs, and Spring's defaults there are
      # 1 MB a file and 10 MB a request. Any file over 1 MB -- a scanned statement, a PDF with
      # images -- was refused before the controller saw it. Keep both equal to MAX_FILE_SIZE;
      # MultipartLimitTest reads this file and fails when they differ. The browser sends every
      # file picked at once in one request, so together they must fit in max-request-size.
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${OWNCLAW_SERVER_PORT:${ownclaw.server.port:8080}}
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

ownclaw:
  executor:
    provider: ollama
    url: ${OWNCLAW_EXECUTOR_URL:http://localhost:11434}
    model: ${OWNCLAW_EXECUTOR_MODEL:qwen2.5:14b}
    temperature: 0.3
    # No context-window setting: every local call is sent the model's own context length
    # (num_ctx), read from Ollama's /api/show.

  mentor:
    provider: ${OWNCLAW_MENTOR_PROVIDER:openai}
    model: gpt-5.2
    api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${OWNCLAW_ANTHROPIC_MODEL:claude-sonnet-4-20250514}
    max-tokens-per-task: 10000
    temperature: 0.4

    # Offer tools natively instead of asking for a JSON envelope in the prompt.
    #
    # Verified in production before this was turned on: both a registry skill (shell_exec) and a
    # special action (respond) came back as tool_use blocks on claude-opus-5, the loop consumed
    # them, and the following step reported "cache: 0 created, 26505 read" -- a pure cache read,
    # so the tools array did not destabilise the cached prefix. Zero parse failures.
    #
    # It should also be cheaper: the prose manifest lives in the dynamic block attached to the
    # newest message, deliberately outside the cache breakpoints, so it was re-billed at full
    # rate every step. In the tools array it sits in the cached prefix.
    #
    # Off instantly and without a restart: POST /api/ops/config/native-tools?enabled=false
    native-tools: ${OWNCLAW_NATIVE_TOOLS:true}

    # On unattended work only, withhold the skills from the cloud so it has to delegate --
    # "cloud orchestrates, local executes" made structural rather than advisory. Attended chat
    # is untouched. If the local tier cannot take the work, or a delegation fails, the cloud
    # gets the full set straight back, so a broken local model cannot stop scheduled work.
    # Off instantly and without a restart: POST /api/ops/config/local-first?enabled=false
    local-first-unattended: ${OWNCLAW_LOCAL_FIRST:true}

  privacy:
    # The canary: every outbound cloud body is checked, byte-wise, against the task's PRIVATE
    # artifacts before the socket opens. ENFORCE refuses a hit and ends the task
    # PRIVACY_BLOCKED; OBSERVE sends it and records OBSERVED_LEAK. There is no off: the door
    # being the only path to a provider, labels at source, descriptors for private results,
    # secrets scrubbed and every call ledgered are not policies. Expected hits in normal
    # operation: zero. Flip at runtime: POST /api/ops/config/privacy-canary?mode=observe
    canary: ${OWNCLAW_PRIVACY_CANARY:ENFORCE}

  budgets:
    daily-cloud-tokens: 0
    per-task-cloud-tokens: 0
    warning-threshold: 0.8

  queue:
    max-concurrent-tasks: 5
    ollama-concurrency: 1
    cloud-concurrency: 3
    sandbox-concurrency: 3
    max-queued-tasks: 50
    # Give background work (priority 2 — the scheduler) its own worker thread, so a task
    # that runs for minutes stops blocking an interactive chat behind it.
    #
    # OFF by default on purpose. It is the first time two agent tasks can run at once, and
    # everything that made that unsafe has been fixed first — cancellation is per task and a
    # Stop is bounded in time, status carries a task id — but the flag exists so the change
    # can be turned on deliberately, and off again in one edit if something surfaces.
    separate-background-lane: false

  tasks:
    # No wall-clock timeout — tasks run until done.
    # Stalled tasks (no progress for stall-timeout) are killed instead.
    step-timeout: 600
    max-plan-steps: 20
    long-running-threshold: 120
    stall-timeout: 600
    heartbeat-interval: 30
    scheduler-poll-interval: 30

  telegram:
    enabled: ${OWNCLAW_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}

  webui:
    enabled: true

  auth:
    # Only the owner can create accounts (/user add). The owner is the oldest account;
    # set a username here only to override that.
    owner: ${OWNCLAW_OWNER:}

  # Ops API (/api/ops/*) — read-only diagnostics plus a few safe actions, for operators
  # and AI assistants. DISABLED unless a token of at least 32 chars is set. The token is
  # read from the environment only and is never stored in the database.
  #   OWNCLAW_OPS_TOKEN=$(openssl rand -hex 32)
  ops:
    token: ${OWNCLAW_OPS_TOKEN:}

  sandbox:
    type: auto
    stall-timeout: 120   # kill process if no output for this many seconds
    default-network: deny
    python-path: python
    container-runtime: auto    # auto, docker, podman, or none
    container-base-image: python:3.11-slim

  skills:
    generated-path: ./skills/generated

  database:
    path: ./data/ownclaw.db

  confidence:
    mentor-threshold: 0.3
    cache-skip-threshold: 0.7

  observability:
    event-log-retention-days: 30
    chat-status-messages: true
    status-verbosity: concise

  feedback:
    max-rounds: 3
    teaching-log-max-entries: 30

  plan-cache:
    enabled: true
    max-entries: 500
    ttl-hours: 168

logging:
  file:
    name: ${OWNCLAW_LOG_FILE:./logs/ownclaw.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
