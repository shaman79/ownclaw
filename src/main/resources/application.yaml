spring:
  application:
    name: ownclaw

  datasource:
    # Pragmas belong in the URL, not in connection-init-sql.
    #
    # connection-init-sql is handed to a single Statement.execute(), and the SQLite driver runs
    # only the FIRST statement in it. Everything after the first semicolon was silently discarded
    # on every connection this application has ever opened. Production showed the signature
    # plainly: /api/ops/health reported journalMode=wal (the first pragma) next to foreignKeys=0
    # (the last), so foreign keys were never enforced despite being asked for.
    #
    # Measured against sqlite-jdbc 3.47.2 before changing this, because the obvious repair --
    # putting the pragmas on one line -- fails in exactly the same way:
    #   one execute() with all four  -> foreign_keys=0  synchronous=2     cache_size=-2000
    #   one execute() per pragma     -> foreign_keys=1  synchronous=1     cache_size=-8000
    #   as URL parameters            -> foreign_keys=1  synchronous=1     cache_size=-8000  wal
    # Only the URL form applies all of them, and it applies to every pooled connection.
    #
    # Enabling foreign keys changes behaviour on a database that has run for months without them,
    # so production was checked for violations first: every table carrying a reference -- and both
    # non-user references, active_session.session_id and message_attachments -- reported zero
    # orphans. Nothing writes a synthetic id into a referencing table either; skill.retired events
    # use user_id='system' and the events table has no foreign key.
    url: "jdbc:sqlite:${ownclaw.database.path:./data/ownclaw.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&cache_size=-8000&foreign_keys=true"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4  # WAL mode allows concurrent readers + 1 writer


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # 100 MB: the request body Cloudflare accepts in front of production -- a larger upload
      # never reaches this server, so nothing lower is set here. FileUploadController accepts
      # files up to the same size (its MAX_FILE_SIZE) and says so when it refuses one, but the
      # container parses the upload before the controller runs, and Spring's defaults there are
      # 1 MB a file and 10 MB a request. Any file over 1 MB -- a scanned statement, a PDF with
      # images -- was refused before the controller saw it. Keep both equal to MAX_FILE_SIZE;
      # MultipartLimitTest reads this file and fails when they differ. The browser sends every
      # file picked at once in one request, so together they must fit in max-request-size.
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${OWNCLAW_SERVER_PORT:${ownclaw.server.port:8080}}
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

ownclaw:
  executor:
    provider: ollama
    url: ${OWNCLAW_EXECUTOR_URL:http://localhost:11434}
    model: ${OWNCLAW_EXECUTOR_MODEL:qwen2.5:14b}
    # How the local model chooses each next piece of a reply, sent with every local call: for a
    # reply it reasons on first, and for one it gives straight away. The model publisher's
    # recommendation for Qwen3.6-35B-A3B (general tasks); set another model's own when it changes.
    # The presence penalty keeps the model out of reasoning loops.
    thinking:
      temperature: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      presence-penalty: 1.5
    answering:
      temperature: 0.7
      top-p: 0.80
      top-k: 20
      min-p: 0.0
      presence-penalty: 1.5
    # No context-window setting: every local call is sent the model's own context length
    # (num_ctx), read from Ollama's /api/show.
    # Ollama sends nothing while the model writes a tool call offered through its tools field, so
    # a model whose template writes calls in Qwen's text format is given its tools in the system
    # message instead, and its calls are read as they stream. false: tools go natively, as before.
    tool-calls-as-text: ${OWNCLAW_EXECUTOR_TOOL_CALLS_AS_TEXT:true}
    # After each chat turn the local model reads what the owner said and was answered, and keeps
    # the facts worth keeping -- shown in the chat as "Remembered", with an Undo. false: it does not.
    capture-facts: ${OWNCLAW_EXECUTOR_CAPTURE_FACTS:true}

  mentor:
    provider: ${OWNCLAW_MENTOR_PROVIDER:openai}
    model: gpt-5.2
    api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${OWNCLAW_ANTHROPIC_MODEL:claude-sonnet-4-20250514}
    temperature: 0.4

    # Local only: call no cloud model; every task runs on the local model, best effort. The
    # settings page and /local on|off set it (saved, so it survives a restart). It is the default:
    # a chat can choose its own time vs cost next to its message box. Off, a task whose cloud
    # model cannot be reached -- no internet, a rejected key, no credit, an outage the retries did
    # not outlast -- moves to the local model by itself.
    local-only: ${OWNCLAW_LOCAL_ONLY:false}

    # Cost over speed on a chat: the cloud plans and the local model runs every skill -- the
    # owner's time-vs-cost slider, saved by the settings page; the default, as local-only is. Off,
    # the cloud runs skills itself.
    prefer-cost: ${OWNCLAW_PREFER_COST:true}

    # How much the models think before they act: low, medium or high -- saved by the settings
    # page; the default, which a chat can override next to its message box. A cloud model that
    # takes an effort is sent it on every step and on the skill code it writes; at low the local
    # model also answers without reasoning first -- on those calls when it runs a task itself, and
    # in delegations -- so its steps are much faster. Medium and high change nothing on the local
    # model.
    thinking-effort: ${OWNCLAW_THINKING_EFFORT:high}

    # Offer tools natively instead of asking for a JSON envelope in the prompt.
    #
    # Verified in production before this was turned on: both a registry skill (shell_exec) and a
    # special action (respond) came back as tool_use blocks on claude-opus-5, the loop consumed
    # them, and the following step reported "cache: 0 created, 26505 read" -- a pure cache read,
    # so the tools array did not destabilise the cached prefix. Zero parse failures.
    #
    # It should also be cheaper: the prose manifest lives in the dynamic block attached to the
    # newest message, deliberately outside the cache breakpoints, so it was re-billed at full
    # rate every step. In the tools array it sits in the cached prefix.
    #
    # Off instantly and without a restart: POST /api/ops/config/native-tools?enabled=false
    native-tools: ${OWNCLAW_NATIVE_TOOLS:true}

    # On unattended work only, withhold the skills from the cloud so it has to delegate --
    # "cloud orchestrates, local executes" made structural rather than advisory. Attended chat
    # is untouched. If the local tier cannot take the work, or a delegation fails, the cloud
    # gets the full set straight back, so a broken local model cannot stop scheduled work.
    # Off instantly and without a restart: POST /api/ops/config/local-first?enabled=false
    local-first-unattended: ${OWNCLAW_LOCAL_FIRST:true}

  privacy:
    # The canary: every outbound cloud body is checked, byte-wise, against the task's PRIVATE
    # artifacts before the socket opens -- all of it but the replayed assistant turns and the
    # tools' descriptions and schemas (see CloudGateway). ENFORCE refuses a hit and ends the task
    # PRIVACY_BLOCKED; OBSERVE sends it and records OBSERVED_LEAK. There is no off: the door
    # being the only path to a provider, labels at source, descriptors for private results,
    # secrets removed and identifiers replaced by the filter (privacy.Redactor), and every call
    # ledgered are not policies. Expected hits in normal operation: zero. Flip at runtime:
    # POST /api/ops/config/privacy-canary?mode=observe
    canary: ${OWNCLAW_PRIVACY_CANARY:ENFORCE}
    # Personal-content sources: a result of a skill whose required credentials include a key
    # starting with one of these is PRIVATE -- the cloud model is shown a description of it, and
    # only the local model reads it. Any other result goes to the cloud through the filter.
    personal-sources: [IMAP_, POP3_]

  budgets:
    daily-cloud-tokens: 0
    per-task-cloud-tokens: 0
    warning-threshold: 0.8

  queue:
    # How many tasks run at once: one at a time per chat, tasks of different chats side by side,
    # scheduled and /bg work beside them but never on the last worker. The local model still
    # works on one task at a time (the agent loop's local lane). 1 runs every task after the one
    # before it, as all of them ran until there was more than one worker.
    max-concurrent-tasks: 5
    ollama-concurrency: 1
    cloud-concurrency: 3
    sandbox-concurrency: 3
    max-queued-tasks: 50

  tasks:
    # No wall-clock timeout — tasks run until done.
    # Stalled tasks (no progress for stall-timeout) are killed instead.
    step-timeout: 600
    long-running-threshold: 120
    stall-timeout: 600
    heartbeat-interval: 30
    scheduler-poll-interval: 30

  telegram:
    enabled: ${OWNCLAW_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}

  webui:
    enabled: true

  auth:
    # Only the owner can create accounts (/user add). The owner is the oldest account;
    # set a username here only to override that.
    owner: ${OWNCLAW_OWNER:}

  # Ops API (/api/ops/*) — read-only diagnostics plus a few safe actions, for operators
  # and AI assistants. DISABLED unless a token of at least 32 chars is set. The token is
  # read from the environment only and is never stored in the database.
  #   OWNCLAW_OPS_TOKEN=$(openssl rand -hex 32)
  ops:
    token: ${OWNCLAW_OPS_TOKEN:}

  sandbox:
    # Skill isolation (SkillJail): every Python process OwnClaw starts on the host for skills
    # (their runs and checks, venv and pip) runs inside an unprivileged bubblewrap jail that
    # sees the host read-only and cannot see the database, .env, uploads it was not handed,
    # other skills, logs, backups, the systemd journal, crash dumps, or /run (the resolver
    # aside). Its /tmp -- the same directory is its /var/tmp -- is its account's: shared by that
    # account's skills and kept between their runs, as the service's own /tmp was, and emptied
    # when OwnClaw restarts; the checks and pip get a fresh one each time. Network stays shared.
    # A skill with system_packages runs in docker/podman instead when one is available --
    # refused while the jail refuses.
    #   auto      jail when /usr/bin/bwrap is installed and passes its self-check. While
    #             bwrap is absent or cannot start a jail (one that cannot mount the jail's own
    #             /dev/mqueue cannot), skills run unjailed, with one warning. It refuses every
    #             launch when bwrap runs but the self-check fails, and when the jail was ready
    #             earlier in this process and cannot start now. Once skills have run unjailed
    #             in a process, the jail turns on only at the next start. With bwrap there and
    #             its self-check unable to run (no disk space, a timeout), it refuses every
    #             launch and looks again each minute.
    #   required  refuse to start a skill when the jail is not working (fail closed)
    #   off       no jail (development, Windows)
    # On a dev host running as your own user, HOME is yours, and the jail does not hide HOME (by
    # design): a skill there reads your dotfiles and reaches your ssh agent under ~/.ssh/agent.
    # Everything listening on loopback or an abstract socket is reachable too: there, your X11
    # display (with ~/.Xauthority readable) and any browser debug port.
    # In production HOME is the service directory, which is hidden, and the unit sets
    # ProtectHome.
    # When jailed, a single launch the jail cannot isolate (a tampered skill directory, a
    # hard link out, a bind reaching protected state, an unreadable directory) is refused.
    # Without bwrap these still apply: every launch -- a skill's run, pip and venv -- gets the
    # environment allow-list, the runner and load-check scripts are created new under random
    # names, and an authored file that is a link or a hard link is refused, never read or
    # written through.
    # A jailed skill sees the host's files but only its own processes: systemctl, timedatectl,
    # hostnamectl, loginctl, busctl, resolvectl, nmcli and the docker CLI fail inside it,
    # journalctl exits 0 with no entries, logger exits 0 while nothing is logged, and Python's
    # SysLogHandler prints a logging-error traceback to stderr for each record. The kernel
    # session keyring is shared with the service (bubblewrap cannot give a jail its own).
    # Install:  sudo apt install bubblewrap, then sudo systemctl restart ownclaw. The jail turns
    #           on at that restart: in a process where skills have run unjailed it stays off,
    #           since what they left running would go on outside it, beside it.
    # Switch off: OWNCLAW_SANDBOX_ISOLATION=off in the root-owned .env, then restart. Taking
    # bwrap away once it has worked also needs that restart (or off): until then, auto refuses.
    isolation: ${OWNCLAW_SANDBOX_ISOLATION:auto}
    # Absolute path only; never looked up on PATH.
    bwrap-path: ${OWNCLAW_SANDBOX_BWRAP_PATH:/usr/bin/bwrap}
    # Host paths a jailed skill may still read, read-only, e.g. a HOME dotfile it needs:
    #   OWNCLAW_SANDBOX_EXPOSE=/opt/ownclaw/.ssh,/opt/ownclaw/.config/rclone
    # The browser builds Playwright installs under ~/.cache/ms-playwright are exposed without
    # being listed (each build directory, not its .links). Every entry is walked when the jail
    # starts, and one holding a hard link to a file outside it is not exposed.
    # Entries that overlap data/, uploads, .env, skills/, logs/, backups/, repo/, the journal,
    # the crash dumps, docker's socket, the system bus or /run/user are dropped, as are /tmp and
    # /var/tmp as a whole.
    expose: []
    stall-timeout: 120   # a container image build is killed after this many seconds without output; a skill's run uses its SKILL.yaml timeout (default 30)
    python-path: python
    container-runtime: auto    # auto, docker, podman, or none
    container-base-image: python:3.11-slim

  skills:
    generated-path: ./skills/generated

  database:
    path: ./data/ownclaw.db

  confidence:
    mentor-threshold: 0.3
    cache-skip-threshold: 0.7

  observability:
    chat-status-messages: true
    status-verbosity: concise

  feedback:
    max-rounds: 3

logging:
  file:
    name: ${OWNCLAW_LOG_FILE:./logs/ownclaw.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
