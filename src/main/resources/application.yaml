spring:
  application:
    name: ownclaw

  datasource:
    url: jdbc:sqlite:${ownclaw.database.path:./data/ownclaw.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4  # WAL mode allows concurrent readers + 1 writer
      connection-init-sql: |
        PRAGMA journal_mode=WAL;
        PRAGMA busy_timeout=5000;
        PRAGMA synchronous=NORMAL;
        PRAGMA cache_size=-8000;
        PRAGMA foreign_keys=ON;

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${OWNCLAW_SERVER_PORT:${ownclaw.server.port:8080}}
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

ownclaw:
  executor:
    provider: ollama
    url: ${OWNCLAW_EXECUTOR_URL:http://localhost:11434}
    model: ${OWNCLAW_EXECUTOR_MODEL:qwen2.5:14b}
    temperature: 0.3

    # Context window for local calls (Ollama num_ctx).
    #
    # 16384 was too small for the job the local tier actually does. A delegation prompt carries
    # the whole tool manifest plus the results accumulated so far, and production measured it at
    # 17226 tokens -- 5% over -- so Ollama returned
    #   HTTP 400 exceed_context_size_error: request (17226 tokens) exceeds the available
    #   context size (16384 tokens)
    # and both scheduled tasks fell back to the cloud on 2026-09-21. The near-misses were worse
    # than the outright failures: when the prompt fits with only a couple of hundred tokens to
    # spare, a thinking model spends every one of them reasoning and returns an empty answer
    # (done_reason=length), which looks like a broken model rather than a full window.
    #
    # 24576 gives ~40% headroom over the measured prompt. It is not set higher because the KV
    # cache grows with it and VRAM on that host is the binding constraint -- raising this too far
    # pushes layers onto the CPU and makes every local call far slower, which is a worse failure
    # than an occasional overflow because it is silent. Raise it with OWNCLAW_EXECUTOR_CONTEXT
    # after checking headroom on the box.
    context-window: ${OWNCLAW_EXECUTOR_CONTEXT:24576}

  mentor:
    provider: ${OWNCLAW_MENTOR_PROVIDER:openai}
    model: gpt-5.2
    api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${OWNCLAW_ANTHROPIC_MODEL:claude-sonnet-4-20250514}
    max-tokens-per-task: 10000
    temperature: 0.4

    # Optional: use the local LLM (Ollama) to pre-select which tools to include
    # in the cloud prompt, to reduce the step-0 cloud prompt size.
    #
    # OFF by default, because on this hardware it costs far more than it saves. A local call
    # measures 60-133 seconds and holds the single Ollama permit, and this one runs at step 0
    # of every task — before the cloud has been asked anything — so it is pure added latency on
    # the critical path of an attended turn, to save roughly 1 kB of prompt.
    #
    # It also does not reliably shrink anything: the deterministic heuristic in ToolSelector
    # sends every tool in full detail below its MAX_DETAILED_TOOLS threshold, so with a small
    # library the local call can only narrow the manifest below what would have been sent
    # anyway — and a narrower manifest is how the model ends up not seeing the tool it should
    # have reused.
    #
    # Turn it back on only with a much larger library AND a measurement showing the cloud
    # prompt actually shrinks by more than the local call costs.
    local-tool-selection: false
    local-tool-selection-max-tools: 12
    local-tool-selection-candidate-limit: 120
    tool-name-preview-limit: 50

  budgets:
    daily-cloud-tokens: 0
    per-task-cloud-tokens: 0
    warning-threshold: 0.8

  queue:
    max-concurrent-tasks: 5
    ollama-concurrency: 1
    cloud-concurrency: 3
    sandbox-concurrency: 3
    max-queued-tasks: 50
    # Give background work (priority 2 — the scheduler) its own worker thread, so a task
    # that runs for minutes stops blocking an interactive chat behind it.
    #
    # OFF by default on purpose. It is the first time two agent tasks can run at once, and
    # everything that made that unsafe has been fixed first — cancellation is per task and a
    # Stop is bounded in time, status carries a task id — but the flag exists so the change
    # can be turned on deliberately, and off again in one edit if something surfaces.
    separate-background-lane: false

  tasks:
    # No wall-clock timeout — tasks run until done.
    # Stalled tasks (no progress for stall-timeout) are killed instead.
    step-timeout: 600
    max-plan-steps: 20
    long-running-threshold: 120
    stall-timeout: 600
    heartbeat-interval: 30
    scheduler-poll-interval: 30
    max-scheduled-tasks-per-user: 50

  telegram:
    enabled: ${OWNCLAW_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}

  webui:
    enabled: true

  auth:
    # Only the owner can create accounts (/user add). The owner is the oldest account;
    # set a username here only to override that.
    owner: ${OWNCLAW_OWNER:}

  # Ops API (/api/ops/*) — read-only diagnostics plus a few safe actions, for operators
  # and AI assistants. DISABLED unless a token of at least 32 chars is set. The token is
  # read from the environment only and is never stored in the database.
  #   OWNCLAW_OPS_TOKEN=$(openssl rand -hex 32)
  ops:
    token: ${OWNCLAW_OPS_TOKEN:}

  sandbox:
    type: auto
    stall-timeout: 120   # kill process if no output for this many seconds
    default-network: deny
    python-path: python
    container-runtime: auto    # auto, docker, podman, or none
    container-base-image: python:3.11-slim

  skills:
    generated-path: ./skills/generated

  database:
    path: ./data/ownclaw.db

  confidence:
    mentor-threshold: 0.3
    cache-skip-threshold: 0.7

  observability:
    event-log-retention-days: 30
    chat-status-messages: true
    status-verbosity: concise

  feedback:
    max-rounds: 3
    teaching-log-max-entries: 30

  plan-cache:
    enabled: true
    max-entries: 500
    ttl-hours: 168

  # MCP Bridge (Model Context Protocol) — external tool servers over stdio.
  mcp:
    enabled: false
    timeout-sec: 60
    servers:
      - name: sqlite
        command: ["npx", "-y", "@modelcontextprotocol/server-sqlite", "/opt/ownclaw/data/ownclaw.db"]
      - name: brave-search
        command: ["npx", "-y", "@modelcontextprotocol/server-brave-search"]
        env:
          BRAVE_API_KEY: "${BRAVE_SEARCH_API_KEY:}"
      - name: fetch
        command: ["npx", "-y", "@modelcontextprotocol/server-fetch"]
      - name: puppeteer
        command: ["npx", "-y", "@modelcontextprotocol/server-puppeteer"]
        env:
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

logging:
  file:
    name: ${OWNCLAW_LOG_FILE:./logs/ownclaw.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
