name: file_operations
version: 1
description: "Read, write, list, delete, or move files and directories"
summary: "Read, write, list, delete, or move files and directories"

triggers:
  keywords: [file, read, write, create, delete, move, copy, list, directory, folder]
  intents: [manage_files, read_file, write_file, list_directory]

parameters:
  - name: operation
    type: string
    required: true
    description: "One of: read, write, append, list, delete, move, copy, mkdir, exists"
  - name: path
    type: string
    required: true
    description: "Target file or directory path"
  - name: content
    type: string
    required: false
    description: "Content for write/append operations"
  - name: destination
    type: string
    required: false
    description: "Destination path for move/copy operations"
  - name: recursive
    type: boolean
    required: false
    description: "Recursive operation for list/delete (default: false)"

credentials: []

permissions:
  network: false
  filesystem: read-write
  timeout: 30

complexity: low
created_by: system
tested: true
reversible: true
interactive: false

changelog:
  - version: 1
    date: "2025-01-01"
    change: "Initial version"
